<!DOCTYPE html>
<html lang="fr" class="h-full bg-slate-950">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Nexus Social & Chat</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { font-family: 'Plus Jakarta Sans', 'Poppins', sans-serif; }
    .chat-scroll::-webkit-scrollbar { width: 4px; }
    .chat-scroll::-webkit-scrollbar-thumb { background: #00d9ff; border-radius: 10px; }
    .neon-border { box-shadow: 0 0 20px rgba(0, 217, 255, 0.2); }
    .meta-gradient { background: linear-gradient(135deg, #0066ff, #00d9ff); }
    
    @keyframes logo-glow {
      0%, 100% { box-shadow: 0 0 25px rgba(225, 29, 72, 0.6), 0 0 50px rgba(59, 130, 246, 0.4); transform: scale(1); }
      50% { box-shadow: 0 0 40px rgba(225, 29, 72, 0.9), 0 0 70px rgba(59, 130, 246, 0.7); transform: scale(1.05); }
    }
    .cool-logo-glow { animation: logo-glow 2.5s infinite ease-in-out; }
  </style>
</head>
<body class="h-full text-slate-100 flex justify-center items-center bg-slate-950 antialiased select-none">

  <div id="splash-screen" class="fixed inset-0 bg-slate-950 flex flex-col items-center justify-between p-8 z-50 transition-all duration-700">
    <div></div>
    <div class="flex flex-col items-center space-y-6">
      <div class="relative group">
        <div class="absolute -inset-1 bg-gradient-to-r from-red-600 via-purple-600 to-blue-600 rounded-3xl blur-md opacity-75 animate-pulse"></div>
        <div class="relative w-24 h-24 rounded-3xl bg-slate-900 border border-slate-700 flex items-center justify-center text-white text-6xl font-black cool-logo-glow">
          <span class="bg-gradient-to-tr from-red-500 via-rose-400 to-blue-500 bg-clip-text text-transparent">J</span>
        </div>
      </div>
      <div class="text-center space-y-1">
        <h1 class="text-2xl font-black tracking-wider text-white">Nexus <span class="bg-gradient-to-r from-blue-400 to-cyan-400 bg-clip-text text-transparent">Social Network</span></h1>
        <p class="text-xs text-slate-400 font-mono uppercase">Créé par Célestin 🇨🇩</p>
      </div>
    </div>
    <p class="text-[10px] text-slate-600 font-mono">v11.0 — Mode Réseau & PV</p>
  </div>

  <div class="w-full max-w-md h-full md:h-[95vh] md:rounded-3xl bg-slate-900 border border-cyan-500/30 shadow-2xl flex flex-col overflow-hidden relative neon-border">

    <div id="view-auth" class="absolute inset-0 z-40 bg-slate-950 p-6 flex flex-col justify-center items-center gap-6">
      <div class="text-center space-y-2">
        <div class="w-16 h-16 rounded-2xl meta-gradient flex items-center justify-center text-3xl mx-auto shadow-lg shadow-cyan-500/50">
          👤
        </div>
        <h2 class="text-2xl font-bold bg-gradient-to-r from-cyan-400 to-blue-500 bg-clip-text text-transparent">Créer mon Profil</h2>
        <p class="text-xs text-slate-400">Configurez votre compte comme sur Facebook</p>
      </div>

      <form onsubmit="handleRegister(event)" class="w-full space-y-4">
        <div class="flex flex-col items-center gap-2">
          <label for="avatar-input" class="relative cursor-pointer group">
            <img id="avatar-preview" src="https://api.dicebear.com/7.x/bottts/svg?seed=user" class="w-20 h-20 rounded-full border-2 border-cyan-400 object-cover bg-slate-900 shadow-xl">
            <div class="absolute inset-0 bg-black/60 rounded-full flex items-center justify-center opacity-0 group-hover:opacity-100 transition">
              <i class="fa-solid fa-camera text-white text-lg"></i>
            </div>
          </label>
          <input type="file" id="avatar-input" accept="image/*" class="hidden" onchange="previewAvatar(event)">
          <span class="text-[10px] text-cyan-400 font-semibold">Choisir une photo de profil</span>
        </div>

        <div>
          <label class="text-[11px] font-semibold text-slate-400 block mb-1">Nom Complet / Pseudo</label>
          <input type="text" id="username-input" required placeholder="Ex: Célestin 🇨🇩" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2.5 text-xs text-white focus:outline-none focus:border-cyan-400">
        </div>

        <div>
          <label class="text-[11px] font-semibold text-slate-400 block mb-1">Bio / Profession</label>
          <input type="text" id="role-input" placeholder="Ex: Développeur & Passionné d'IA" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2.5 text-xs text-white focus:outline-none focus:border-cyan-400">
        </div>

        <button type="submit" class="w-full py-3 meta-gradient rounded-xl font-bold text-xs text-white shadow-lg shadow-cyan-500/30 hover:opacity-90 transition">
          Rejoindre le Réseau
        </button>
      </form>

      <div class="mt-auto flex items-center gap-1.5 text-slate-500 text-[11px]">
        <span>From</span>
        <i class="fa-brands fa-meta text-cyan-400 text-sm"></i>
        <span class="font-bold text-slate-400 tracking-wider">Meta Nexus</span>
      </div>
    </div>

    <header class="bg-slate-900/90 border-b border-cyan-500/20 p-3.5 flex items-center justify-between sticky top-0 z-30 backdrop-blur-md">
      <div class="flex items-center gap-3">
        <img id="user-display-avatar" src="" class="w-9 h-9 rounded-full border border-cyan-400 object-cover hidden">
        <div>
          <h1 class="font-bold text-sm bg-gradient-to-r from-cyan-400 to-blue-400 bg-clip-text text-transparent" id="user-display-name">Nexus Social</h1>
          <p class="text-[9px] text-cyan-400 font-mono flex items-center gap-1" id="user-display-role">En ligne</p>
        </div>
      </div>
      <div class="flex items-center gap-3 text-slate-400">
        <button onclick="promptNewGroup()" class="text-xs bg-slate-800 border border-slate-700 px-2.5 py-1 rounded-lg hover:text-cyan-400 flex items-center gap-1">
          <i class="fa-solid fa-users"></i> + Groupe
        </button>
        <i class="fa-solid fa-ellipsis-vertical hover:text-cyan-400 cursor-pointer transition" onclick="showInfo()"></i>
      </div>
    </header>

    <div id="tab-feed-view" class="flex-1 overflow-y-auto chat-scroll p-3 space-y-4">
      
      <div class="bg-slate-900 border border-slate-800 p-3 rounded-2xl space-y-3">
        <div class="flex items-center gap-2">
          <img id="feed-user-avatar" src="" class="w-8 h-8 rounded-full border border-cyan-400 object-cover">
          <input type="text" id="post-input" placeholder="Que voulez-vous exprimer aujourd'hui ?" class="flex-1 bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-cyan-400">
        </div>
        <div class="flex justify-between items-center pt-2 border-t border-slate-800/60">
          <div class="flex gap-3 text-slate-400 text-xs">
            <span class="hover:text-cyan-400 cursor-pointer flex items-center gap-1 text-[11px]"><i class="fa-solid fa-image text-emerald-400"></i> Photo</span>
            <span class="hover:text-cyan-400 cursor-pointer flex items-center gap-1 text-[11px]"><i class="fa-solid fa-tag text-blue-400"></i> Identifier</span>
          </div>
          <button onclick="createPost()" class="px-3 py-1.5 meta-gradient rounded-xl text-xs font-bold text-white shadow-md">Publier</button>
        </div>
      </div>

      <div id="posts-container" class="space-y-4"></div>
    </div>

    <div id="tab-chats-view" class="hidden flex-1 overflow-y-auto chat-scroll divide-y divide-slate-800/50">
      <div class="p-2 flex justify-between items-center bg-slate-950/50">
        <span class="text-[10px] font-bold text-cyan-400 uppercase tracking-wider px-2">Conversations & Groupes</span>
        <button onclick="promptNewPV()" class="text-[11px] text-slate-300 hover:text-cyan-400 px-2">+ Nouveau PV</button>
      </div>
      <div id="chats-list-container"></div>
    </div>

    <div id="view-chat-room" class="hidden flex-1 flex-col h-full bg-slate-950 overflow-hidden relative">
      <div class="bg-slate-900 border-b border-slate-800 p-2.5 flex items-center justify-between z-10">
        <div class="flex items-center gap-2">
          <i class="fa-solid fa-arrow-left text-slate-400 p-2 cursor-pointer hover:text-white" onclick="closeChat()"></i>
          <img id="room-avatar" src="" class="w-8 h-8 rounded-full border border-cyan-400 object-cover">
          <div>
            <h3 id="room-title" class="font-bold text-xs text-white">Discussion</h3>
            <p id="room-status" class="text-[9px] text-emerald-400">En ligne</p>
          </div>
        </div>
        <div class="flex items-center gap-3 text-slate-400 text-xs">
          <i class="fa-solid fa-video cursor-pointer hover:text-cyan-400"></i>
          <i class="fa-solid fa-phone cursor-pointer hover:text-cyan-400"></i>
        </div>
      </div>

      <div id="messages-box" class="flex-1 p-3 overflow-y-auto space-y-3 chat-scroll"></div>

      <form onsubmit="sendMsg(event)" class="p-2 bg-slate-900 border-t border-slate-800 flex items-center gap-2">
        <input type="text" id="chat-input" placeholder="Écrire un message privé..." class="flex-1 bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-cyan-400">
        <button type="submit" class="w-9 h-9 rounded-xl meta-gradient text-white flex items-center justify-center text-xs shadow-lg shadow-cyan-500/20">
          <i class="fa-solid fa-paper-plane"></i>
        </button>
      </form>
    </div>

    <nav class="bg-slate-900 border-t border-slate-800 py-2.5 px-6 flex justify-around items-center sticky bottom-0 z-30">
      <button onclick="switchTab('feed')" id="nav-feed" class="flex flex-col items-center gap-1 text-cyan-400">
        <i class="fa-solid fa-house text-base"></i>
        <span class="text-[9px] font-bold">Accueil</span>
      </button>

      <button onclick="switchTab('chats')" id="nav-chats" class="flex flex-col items-center gap-1 text-slate-500 hover:text-cyan-400">
        <i class="fa-solid fa-comments text-base"></i>
        <span class="text-[9px] font-bold">Messages PV</span>
      </button>

      <button onclick="showInfo()" class="flex flex-col items-center gap-1 text-slate-500 hover:text-cyan-400">
        <i class="fa-solid fa-user text-base"></i>
        <span class="text-[9px] font-bold">Profil</span>
      </button>
    </nav>

  </div>

  <script>
    let userData = {
      name: localStorage.getItem('fb_user_name') || '',
      role: localStorage.getItem('fb_user_role') || '',
      avatar: localStorage.getItem('fb_user_avatar') || 'https://api.dicebear.com/7.x/bottts/svg?seed=user'
    };

    let posts = JSON.parse(localStorage.getItem('fb_posts')) || [
      {
        id: 1,
        author: 'Célestin 🇨🇩',
        avatar: 'https://api.dicebear.com/7.x/avataaars/svg?seed=celestin',
        content: 'Bienvenue sur la nouvelle plateforme Nexus Social ! Vous pouvez créer vos groupes et écrire en PV ici.',
        likes: 5,
        time: 'Il y a 10 min'
      }
    ];

    let chats = JSON.parse(localStorage.getItem('fb_chats')) || [
      {
        id: 'neo',
        name: 'JPP NEO IA (PV)',
        avatar: 'https://api.dicebear.com/7.x/bottts/svg?seed=neo',
        type: 'bot',
        messages: [{ sender: 'bot', text: 'Salut ! Je suis ton assistant virtuel en PV.', time: '10:00' }]
      },
      {
        id: 'groupe_boulot',
        name: 'Groupe Projet Nexus 🇨🇩',
        avatar: 'https://api.dicebear.com/7.x/identicon/svg?seed=boulot',
        type: 'group',
        messages: [{ sender: 'other', text: 'Célestin: Tout le monde est prêt ?', time: '10:15' }]
      }
    ];

    let currentChatId = null;

    document.addEventListener('DOMContentLoaded', () => {
      setTimeout(() => {
        document.getElementById('splash-screen').classList.add('opacity-0', 'pointer-events-none');
      }, 1200);

      if (userData.name) {
        initUserProfile();
        document.getElementById('view-auth').classList.add('hidden');
      }
      renderPosts();
      renderChatsList();
    });

    function previewAvatar(event) {
      const file = event.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(e) {
          userData.avatar = e.target.result;
          document.getElementById('avatar-preview').src = e.target.result;
        }
        reader.readAsDataURL(file);
      }
    }

    function handleRegister(e) {
      e.preventDefault();
      userData.name = document.getElementById('username-input').value.trim();
      userData.role = document.getElementById('role-input').value.trim() || 'Membre Nexus';

      localStorage.setItem('fb_user_name', userData.name);
      localStorage.setItem('fb_user_role', userData.role);
      localStorage.setItem('fb_user_avatar', userData.avatar);

      initUserProfile();
      document.getElementById('view-auth').classList.add('hidden');
    }

    function initUserProfile() {
      document.getElementById('user-display-name').innerText = userData.name;
      document.getElementById('user-display-role').innerText = userData.role;
      
      const avatars = [document.getElementById('user-display-avatar'), document.getElementById('feed-user-avatar')];
      avatars.forEach(img => {
        if(img) {
          img.src = userData.avatar;
          img.classList.remove('hidden');
        }
      });
    }

    // GESTION FIL D'ACTUALITÉ
    function createPost() {
      const input = document.getElementById('post-input');
      const content = input.value.trim();
      if (!content) return;

      posts.unshift({
        id: Date.now(),
        author: userData.name,
        avatar: userData.avatar,
        content: content,
        likes: 0,
        time: 'À l\'instant'
      });

      localStorage.setItem('fb_posts', JSON.stringify(posts));
      input.value = '';
      renderPosts();
    }

    function renderPosts() {
      const container = document.getElementById('posts-container');
      container.innerHTML = '';

      posts.forEach(post => {
        container.innerHTML += `
          <div class="bg-slate-900 border border-slate-800 p-3.5 rounded-2xl space-y-2.5">
            <div class="flex items-center gap-2.5">
              <img src="${post.avatar}" class="w-9 h-9 rounded-full border border-cyan-400 object-cover">
              <div>
                <h4 class="font-bold text-xs text-white">${post.author}</h4>
                <p class="text-[9px] text-slate-500">${post.time}</p>
              </div>
            </div>
            <p class="text-xs text-slate-200 leading-relaxed">${post.content}</p>
            <div class="flex justify-between items-center pt-2 border-t border-slate-800/60 text-slate-400 text-xs">
              <button onclick="likePost(${post.id})" class="hover:text-cyan-400 flex items-center gap-1 text-[11px]">
                <i class="fa-regular fa-thumbs-up"></i> J'aime (${post.likes})
              </button>
              <button onclick="openPVWith('${post.author}')" class="hover:text-cyan-400 flex items-center gap-1 text-[11px]">
                <i class="fa-regular fa-paper-plane"></i> Écrire en PV
              </button>
            </div>
          </div>
        `;
      });
    }

    function likePost(id) {
      const post = posts.find(p => p.id === id);
      if (post) {
        post.likes++;
        localStorage.setItem('fb_posts', JSON.stringify(posts));
        renderPosts();
      }
    }

    // GESTION MULTI-CHATS & PV
    function renderChatsList() {
      const container = document.getElementById('chats-list-container');
      container.innerHTML = '';

      chats.forEach(chat => {
        const lastMsg = chat.messages[chat.messages.length - 1];
        container.innerHTML += `
          <div onclick="openChat('${chat.id}')" class="flex items-center gap-3 p-3.5 hover:bg-slate-800/50 cursor-pointer transition">
            <img src="${chat.avatar}" class="w-11 h-11 rounded-full border border-cyan-400 object-cover bg-slate-900">
            <div class="flex-1 min-w-0">
              <div class="flex justify-between items-center mb-0.5">
                <h2 class="font-bold text-xs text-white truncate">${chat.name}</h2>
                <span class="text-[9px] text-cyan-400">${lastMsg ? lastMsg.time : ''}</span>
              </div>
              <p class="text-[11px] text-slate-400 truncate">${lastMsg ? lastMsg.text : 'Discussion démarrée'}</p>
            </div>
          </div>
        `;
      });
    }

    function openChat(id) {
      currentChatId = id;
      const chat = chats.find(c => c.id === id);
      if (!chat) return;

      document.getElementById('tab-chats-view').classList.add('hidden');
      document.getElementById('tab-feed-view').classList.add('hidden');
      document.getElementById('view-chat-room').classList.remove('hidden');
      document.getElementById('view-chat-room').classList.add('flex');

      document.getElementById('room-title').innerText = chat.name;
      document.getElementById('room-avatar').src = chat.avatar;

      renderMessages();
    }

    function closeChat() {
      document.getElementById('view-chat-room').classList.add('hidden');
      document.getElementById('view-chat-room').classList.remove('flex');
      switchTab('chats');
    }

    function renderMessages() {
      const chat = chats.find(c => c.id === currentChatId);
      const box = document.getElementById('messages-box');
      box.innerHTML = '';

      chat.messages.forEach(msg => {
        if (msg.sender === 'me') {
          box.innerHTML += `
            <div class="flex items-end gap-2 justify-end">
              <div class="flex flex-col gap-1 max-w-[75%] meta-gradient p-3 rounded-2xl text-xs text-white shadow-md">
                <p>${msg.text}</p>
                <span class="text-[8px] text-right text-cyan-100 font-mono">${msg.time}</span>
              </div>
              <img src="${userData.avatar}" class="w-6 h-6 rounded-full border border-cyan-300 object-cover">
            </div>
          `;
        } else {
          box.innerHTML += `
            <div class="flex items-end gap-2 justify-start">
              <img src="${chat.avatar}" class="w-6 h-6 rounded-full border border-cyan-300 object-cover">
              <div class="flex flex-col gap-1 max-w-[75%] bg-slate-900 border border-slate-800 p-3 rounded-2xl text-xs text-slate-200 shadow-md">
                <p>${msg.text}</p>
                <span class="text-[8px] text-right text-cyan-400 font-mono">${msg.time}</span>
              </div>
            </div>
          `;
        }
      });

      box.scrollTop = box.scrollHeight;
    }

    function sendMsg(e) {
      e.preventDefault();
      const input = document.getElementById('chat-input');
      const text = input.value.trim();
      if (!text || !currentChatId) return;

      const chat = chats.find(c => c.id === currentChatId);
      const now = new Date();
      const timeStr = `${now.getHours()}:${now.getMinutes() < 10 ? '0' : ''}${now.getMinutes()}`;

      chat.messages.push({ sender: 'me', text: text, time: timeStr });
      input.value = '';
      localStorage.setItem('fb_chats', JSON.stringify(chats));
      renderMessages();

      if (chat.type === 'bot') {
        setTimeout(() => {
          let reply = "Message reçu en PV !";
          if (text.toLowerCase().includes("créateur")) reply = "Mon créateur est Célestin 🇨🇩";
          chat.messages.push({ sender: 'bot', text: reply, time: timeStr });
          localStorage.setItem('fb_chats', JSON.stringify(chats));
          renderMessages();
        }, 600);
      }
    }

    function promptNewPV() {
      const name = prompt("Nom du membre pour écrire en PV :");
      if (name) openPVWith(name);
    }

    function openPVWith(name) {
      let chat = chats.find(c => c.name.toLowerCase() === name.toLowerCase());
      if (!chat) {
        chat = {
          id: 'pv_' + Date.now(),
          name: name + ' (PV)',
          avatar: `https://api.dicebear.com/7.x/identicon/svg?seed=${name}`,
          type: 'pv',
          messages: [{ sender: 'other', text: `Bonjour ! Discussion PV avec ${name}.`, time: 'Aujourd\'hui' }]
        };
        chats.push(chat);
        localStorage.setItem('fb_chats', JSON.stringify(chats));
        renderChatsList();
      }
      openChat(chat.id);
    }

    function promptNewGroup() {
      const name = prompt("Nom du nouveau groupe :");
      if (name) {
        chats.push({
          id: 'group_' + Date.now(),
          name: 'Groupe : ' + name,
          avatar: `https://api.dicebear.com/7.x/identicon/svg?seed=${name}`,
          type: 'group',
          messages: [{ sender: 'other', text: 'Groupe créé ! Bienvenue à tous.', time: 'Aujourd\'hui' }]
        });
        localStorage.setItem('fb_chats', JSON.stringify(chats));
        renderChatsList();
        switchTab('chats');
      }
    }

    function switchTab(tab) {
      document.getElementById('view-chat-room').classList.add('hidden');
      if (tab === 'feed') {
        document.getElementById('tab-feed-view').classList.remove('hidden');
        document.getElementById('tab-chats-view').classList.add('hidden');
        document.getElementById('nav-feed').className = "flex flex-col items-center gap-1 text-cyan-400";
        document.getElementById('nav-chats').className = "flex flex-col items-center gap-1 text-slate-500";
      } else if (tab === 'chats') {
        document.getElementById('tab-feed-view').classList.add('hidden');
        document.getElementById('tab-chats-view').classList.remove('hidden');
        document.getElementById('nav-chats').className = "flex flex-col items-center gap-1 text-cyan-400";
        document.getElementById('nav-feed').className = "flex flex-col items-center gap-1 text-slate-500";
      }
    }

    function showInfo() {
      alert(`Profil : ${userData.name || 'Anonyme'}\nRôle : ${userData.role || 'Membre'}\nCréateur : Célestin 🇨🇩`);
    }
  </script>
</body>
</html>

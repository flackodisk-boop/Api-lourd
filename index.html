<!DOCTYPE html>
<html lang="fr" class="h-full bg-slate-950">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Nexus Ultimate Network</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { font-family: 'Plus Jakarta Sans', sans-serif; }
    .chat-scroll::-webkit-scrollbar { width: 3px; }
    .chat-scroll::-webkit-scrollbar-thumb { background: #00d9ff; border-radius: 10px; }
    .neon-border { box-shadow: 0 0 25px rgba(0, 217, 255, 0.15); }
    .meta-gradient { background: linear-gradient(135deg, #0066ff, #00d9ff); }
    .story-ring { background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888); }
  </style>
</head>
<body class="h-full text-slate-100 flex justify-center items-center bg-slate-950 antialiased select-none">

  <div class="w-full max-w-md h-full md:h-[95vh] md:rounded-3xl bg-slate-900 border border-cyan-500/20 shadow-2xl flex flex-col overflow-hidden relative neon-border">

    <header class="bg-slate-900/95 border-b border-slate-800 p-3.5 flex items-center justify-between sticky top-0 z-30 backdrop-blur-md">
      <div class="flex items-center gap-3">
        <div class="relative cursor-pointer" onclick="openProfileSettings()">
          <img id="header-avatar" src="https://api.dicebear.com/7.x/bottts/svg?seed=celestin" class="w-10 h-10 rounded-full border-2 border-cyan-400 object-cover bg-slate-950">
          <span class="absolute bottom-0 right-0 w-3 h-3 bg-emerald-500 rounded-full border-2 border-slate-900"></span>
        </div>
        <div>
          <h1 class="font-bold text-xs text-white flex items-center gap-1">
            <span id="header-user-name">Célestin 🇨🇩</span>
            <i class="fa-solid fa-circle-check text-cyan-400 text-[10px]"></i>
          </h1>
          <p id="header-user-role" class="text-[10px] text-cyan-400 font-mono">Dev Google</p>
        </div>
      </div>
      <div class="flex items-center gap-2">
        <button onclick="openModal('modal-group')" class="text-xs bg-slate-800/80 border border-slate-700 hover:border-cyan-500 text-slate-200 px-3 py-1.5 rounded-xl flex items-center gap-1.5 transition active:scale-95">
          <i class="fa-solid fa-users text-cyan-400"></i>
          <span>+ Groupe</span>
        </button>
        <button onclick="openProfileSettings()" class="w-8 h-8 rounded-xl bg-slate-800/60 flex items-center justify-center text-slate-400 hover:text-white transition">
          <i class="fa-solid fa-gear"></i>
        </button>
      </div>
    </header>

    <main id="tab-feed" class="flex-1 overflow-y-auto chat-scroll p-3 space-y-3">
      
      <div class="flex gap-2.5 overflow-x-auto pb-2 chat-scroll">
        <div class="flex-shrink-0 w-16 flex flex-col items-center gap-1 cursor-pointer" onclick="alert('Ajouter un statut')">
          <div class="w-14 h-14 rounded-full border-2 border-dashed border-cyan-400 flex items-center justify-center bg-slate-950">
            <i class="fa-solid fa-plus text-cyan-400 text-sm"></i>
          </div>
          <span class="text-[9px] text-slate-400 font-medium">Mon statut</span>
        </div>
        <div id="stories-container" class="flex gap-2.5">
          </div>
      </div>

      <div class="bg-slate-900 border border-slate-800 p-3 rounded-2xl space-y-3 shadow-lg">
        <div class="flex items-center gap-2">
          <img id="post-user-avatar" src="https://api.dicebear.com/7.x/bottts/svg?seed=celestin" class="w-8 h-8 rounded-full border border-cyan-400 object-cover">
          <input type="text" id="post-input" placeholder="Que voulez-vous exprimer aujourd'hui ?" class="flex-1 bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-cyan-400">
        </div>

        <div id="post-image-preview-box" class="hidden relative rounded-xl overflow-hidden border border-slate-800">
          <img id="post-image-preview" src="" class="w-full max-h-48 object-cover">
          <button onclick="removePostImage()" class="absolute top-2 right-2 bg-black/70 text-white w-6 h-6 rounded-full text-xs">✕</button>
        </div>

        <div class="flex justify-between items-center pt-2 border-t border-slate-800/80">
          <div class="flex gap-3 text-slate-400 text-xs">
            <label for="post-file-input" class="hover:text-cyan-400 cursor-pointer flex items-center gap-1 text-[11px]">
              <i class="fa-solid fa-image text-emerald-400"></i> Photo
            </label>
            <input type="file" id="post-file-input" accept="image/*" class="hidden" onchange="attachImageToPost(event)">
            <span onclick="generateAIPost()" class="hover:text-cyan-400 cursor-pointer flex items-center gap-1 text-[11px]">
              <i class="fa-solid fa-wand-magic-sparkles text-purple-400"></i> Post IA
            </span>
          </div>
          <button onclick="publishPost()" class="px-4 py-1.5 meta-gradient rounded-xl text-xs font-bold text-white shadow-md active:scale-95 transition">
            Publier
          </button>
        </div>
      </div>

      <div id="posts-container" class="space-y-3"></div>
    </main>

    <main id="tab-chats" class="hidden flex-1 overflow-y-auto chat-scroll">
      <div class="p-3 border-b border-slate-800/80 bg-slate-950/40 space-y-2">
        <div class="flex justify-between items-center">
          <span class="text-[10px] font-bold text-cyan-400 uppercase tracking-wider">Discussions & Groupes</span>
          <button onclick="openModal('modal-pv')" class="text-[11px] text-cyan-400 font-semibold hover:underline">
            + Nouveau PV
          </button>
        </div>
        <div class="relative">
          <i class="fa-solid fa-magnifying-glass absolute left-3 top-2.5 text-slate-500 text-xs"></i>
          <input type="text" oninput="filterChats(this.value)" placeholder="Rechercher un membre ou un groupe..." class="w-full bg-slate-900 border border-slate-800 rounded-xl pl-8 pr-3 py-1.5 text-xs text-white focus:outline-none focus:border-cyan-400">
        </div>
      </div>

      <div id="chats-list" class="divide-y divide-slate-800/40"></div>
    </main>

    <div id="view-chat-room" class="hidden absolute inset-0 z-40 bg-slate-950 flex flex-col">
      <div class="bg-slate-900 border-b border-slate-800 p-3 flex items-center justify-between">
        <div class="flex items-center gap-2.5">
          <button onclick="closeChatRoom()" class="text-slate-400 hover:text-white p-1">
            <i class="fa-solid fa-arrow-left"></i>
          </button>
          <img id="room-avatar" src="" class="w-9 h-9 rounded-full border border-cyan-400 object-cover bg-slate-950">
          <div>
            <h3 id="room-title" class="font-bold text-xs text-white">Chat</h3>
            <p id="room-status" class="text-[9px] text-emerald-400 font-mono">En ligne</p>
          </div>
        </div>
        <div class="flex items-center gap-3 text-slate-400 text-xs">
          <i class="fa-solid fa-phone cursor-pointer hover:text-cyan-400" onclick="triggerCall('Audio')"></i>
          <i class="fa-solid fa-video cursor-pointer hover:text-cyan-400" onclick="triggerCall('Vidéo')"></i>
        </div>
      </div>

      <div id="messages-box" class="flex-1 p-3 overflow-y-auto space-y-2.5 chat-scroll"></div>

      <div id="chat-img-preview-box" class="hidden px-3 py-1 bg-slate-900 border-t border-slate-800 flex items-center gap-2">
        <img id="chat-img-preview" src="" class="w-10 h-10 object-cover rounded-lg">
        <span class="text-[10px] text-slate-400 flex-1">Image prête</span>
        <button onclick="clearChatImage()" class="text-xs text-rose-500">✕</button>
      </div>

      <form onsubmit="sendMessage(event)" class="p-2.5 bg-slate-900 border-t border-slate-800 flex items-center gap-2">
        <label for="chat-file-input" class="text-slate-400 hover:text-cyan-400 cursor-pointer p-1">
          <i class="fa-solid fa-paperclip text-sm"></i>
        </label>
        <input type="file" id="chat-file-input" accept="image/*" class="hidden" onchange="attachImageToChat(event)">

        <input type="text" id="chat-input" placeholder="Écrire (/image pour générer)..." class="flex-1 bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-cyan-400">

        <button type="button" id="record-btn" onclick="toggleVoiceRecord()" class="w-9 h-9 rounded-xl bg-slate-800 text-slate-300 hover:text-rose-400 flex items-center justify-center text-xs transition">
          <i class="fa-solid fa-microphone" id="mic-icon"></i>
        </button>

        <button type="submit" class="w-9 h-9 rounded-xl meta-gradient text-white flex items-center justify-center text-xs shadow-lg">
          <i class="fa-solid fa-paper-plane"></i>
        </button>
      </form>
    </div>

    <nav class="bg-slate-900 border-t border-slate-800 py-2.5 px-8 flex justify-around items-center sticky bottom-0 z-30">
      <button onclick="switchTab('feed')" id="nav-btn-feed" class="flex flex-col items-center gap-1 text-cyan-400">
        <i class="fa-solid fa-house text-base"></i>
        <span class="text-[9px] font-bold">Accueil</span>
      </button>

      <button onclick="switchTab('chats')" id="nav-btn-chats" class="flex flex-col items-center gap-1 text-slate-500 hover:text-cyan-400">
        <i class="fa-solid fa-comments text-base"></i>
        <span class="text-[9px] font-bold">Messages</span>
      </button>

      <button onclick="openProfileSettings()" class="flex flex-col items-center gap-1 text-slate-500 hover:text-cyan-400">
        <i class="fa-solid fa-gear text-base"></i>
        <span class="text-[9px] font-bold">Paramètres</span>
      </button>
    </nav>

    <div id="modal-settings" class="hidden absolute inset-0 z-50 bg-slate-950/95 p-6 flex flex-col justify-center items-center backdrop-blur-md">
      <div class="w-full max-w-sm bg-slate-900 border border-slate-800 rounded-3xl p-5 space-y-4 shadow-2xl">
        <div class="flex justify-between items-center border-b border-slate-800 pb-2">
          <h3 class="font-bold text-sm text-white">Éditer mon profil</h3>
          <button onclick="closeModal('modal-settings')" class="text-slate-400 hover:text-white">✕</button>
        </div>

        <div class="flex flex-col items-center gap-2">
          <label for="avatar-file-input" class="relative cursor-pointer group">
            <img id="avatar-preview" src="https://api.dicebear.com/7.x/bottts/svg?seed=celestin" class="w-20 h-20 rounded-full border-2 border-cyan-400 object-cover bg-slate-950">
            <div class="absolute inset-0 bg-black/60 rounded-full flex items-center justify-center opacity-0 group-hover:opacity-100 transition">
              <i class="fa-solid fa-camera text-white text-base"></i>
            </div>
          </label>
          <input type="file" id="avatar-file-input" accept="image/*" class="hidden" onchange="loadAvatarFromGallery(event)">
          <span class="text-[10px] text-cyan-400 font-semibold cursor-pointer" onclick="document.getElementById('avatar-file-input').click()">Changer photo</span>
        </div>

        <div class="space-y-3">
          <div>
            <label class="text-[10px] text-slate-400 block mb-1">Nom / Pseudo</label>
            <input type="text" id="username-input" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-cyan-400">
          </div>
          <div>
            <label class="text-[10px] text-slate-400 block mb-1">Rôle / Statut</label>
            <input type="text" id="role-input" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-cyan-400">
          </div>
        </div>

        <button onclick="saveUserProfile()" class="w-full py-2.5 meta-gradient rounded-xl text-xs font-bold text-white shadow-lg">Sauvegarder</button>
      </div>
    </div>

    <div id="modal-group" class="hidden absolute inset-0 z-50 bg-slate-950/95 p-6 flex flex-col justify-center items-center backdrop-blur-md">
      <div class="w-full max-w-sm bg-slate-900 border border-slate-800 rounded-3xl p-5 space-y-4">
        <div class="flex justify-between items-center border-b border-slate-800 pb-2">
          <h3 class="font-bold text-sm text-white">Nouveau Groupe</h3>
          <button onclick="closeModal('modal-group')" class="text-slate-400">✕</button>
        </div>
        <input type="text" id="group-name-input" placeholder="Nom du groupe..." class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-cyan-400">
        <button onclick="createGroupSubmit()" class="w-full py-2.5 meta-gradient rounded-xl text-xs font-bold text-white">Créer le groupe</button>
      </div>
    </div>

    <div id="modal-pv" class="hidden absolute inset-0 z-50 bg-slate-950/95 p-6 flex flex-col justify-center items-center backdrop-blur-md">
      <div class="w-full max-w-sm bg-slate-900 border border-slate-800 rounded-3xl p-5 space-y-4">
        <div class="flex justify-between items-center border-b border-slate-800 pb-2">
          <h3 class="font-bold text-sm text-white">Nouvelle discussion PV</h3>
          <button onclick="closeModal('modal-pv')" class="text-slate-400">✕</button>
        </div>
        <input type="text" id="pv-name-input" placeholder="Nom du membre..." class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-cyan-400">
        <button onclick="createPVSubmit()" class="w-full py-2.5 meta-gradient rounded-xl text-xs font-bold text-white">Démarrer le PV</button>
      </div>
    </div>

  </div>

  <script>
    // DONNÉES UTILISATEUR ET ÉTAT DE L'APPLICATION
    let user = {
      name: localStorage.getItem('nexus_user_name') || 'Célestin 🇨🇩',
      role: localStorage.getItem('nexus_user_role') || 'Dev Google',
      avatar: localStorage.getItem('nexus_user_avatar') || 'https://api.dicebear.com/7.x/bottts/svg?seed=celestin'
    };

    let tempPostImage = null;
    let tempChatImage = null;
    let mediaRecorder = null;
    let audioChunks = [];
    let isRecording = false;
    let activeChatId = null;

    let posts = JSON.parse(localStorage.getItem('nexus_posts')) || [
      {
        id: 101,
        author: 'Célestin 🇨🇩',
        avatar: 'https://api.dicebear.com/7.x/avataaars/svg?seed=celestin',
        content: 'Bienvenue sur Nexus ! Vous pouvez ajouter des stories, générer des images par IA et envoyer de vrais vocaux !',
        image: null,
        likes: 15,
        reactions: { '👍': 10, '🔥': 5 },
        comments: ['Génial !', 'Au top !'],
        time: 'Il y a 5 min'
      }
    ];

    let chats = JSON.parse(localStorage.getItem('nexus_chats')) || [
      {
        id: 'neo_ia',
        name: 'JPP NEO IA (PV)',
        avatar: 'https://api.dicebear.com/7.x/bottts/svg?seed=neo',
        type: 'bot',
        messages: [{ sender: 'bot', text: 'Salut ! Écris-moi ou tape /image + description pour créer une image.', time: '10:00' }]
      },
      {
        id: 'group_projet',
        name: 'Groupe Projet Nexus 🇨🇩',
        avatar: 'https://api.dicebear.com/7.x/identicon/svg?seed=nexus',
        type: 'group',
        messages: [{ sender: 'other', text: 'Célestin: Tout le monde est prêt ?', time: '10:15' }]
      }
    ];

    let stories = [
      { id: 1, name: 'NEO IA', avatar: 'https://api.dicebear.com/7.x/bottts/svg?seed=neo' },
      { id: 2, name: 'Projet 🇨🇩', avatar: 'https://api.dicebear.com/7.x/identicon/svg?seed=nexus' },
      { id: 3, name: 'Sarah', avatar: 'https://api.dicebear.com/7.x/avataaars/svg?seed=sarah' }
    ];

    // INITIALISATION
    document.addEventListener('DOMContentLoaded', () => {
      applyUserProfile();
      renderStories();
      renderPosts();
      renderChatsList();
    });

    // PROFIL ET MODALES
    function openModal(id) { document.getElementById(id).classList.remove('hidden'); }
    function closeModal(id) { document.getElementById(id).classList.add('hidden'); }

    function openProfileSettings() {
      document.getElementById('username-input').value = user.name;
      document.getElementById('role-input').value = user.role;
      document.getElementById('avatar-preview').src = user.avatar;
      openModal('modal-settings');
    }

    function loadAvatarFromGallery(e) {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(evt) {
          user.avatar = evt.target.result;
          document.getElementById('avatar-preview').src = user.avatar;
        };
        reader.readAsDataURL(file);
      }
    }

    function saveUserProfile() {
      user.name = document.getElementById('username-input').value.trim() || 'Membre';
      user.role = document.getElementById('role-input').value.trim() || 'Dev';

      localStorage.setItem('nexus_user_name', user.name);
      localStorage.setItem('nexus_user_role', user.role);
      localStorage.setItem('nexus_user_avatar', user.avatar);

      applyUserProfile();
      closeModal('modal-settings');
    }

    function applyUserProfile() {
      document.getElementById('header-user-name').innerText = user.name;
      document.getElementById('header-user-role').innerText = user.role;
      document.getElementById('header-avatar').src = user.avatar;
      document.getElementById('post-user-avatar').src = user.avatar;
    }

    // STORIES / STATUTS
    function renderStories() {
      const container = document.getElementById('stories-container');
      container.innerHTML = '';
      stories.forEach(s => {
        container.innerHTML += `
          <div class="flex-shrink-0 w-16 flex flex-col items-center gap-1 cursor-pointer" onclick="alert('Statut de ${s.name}')">
            <div class="p-0.5 story-ring rounded-full">
              <img src="${s.avatar}" class="w-13 h-13 rounded-full border-2 border-slate-900 object-cover bg-slate-950">
            </div>
            <span class="text-[9px] text-slate-300 font-medium truncate w-14 text-center">${s.name}</span>
          </div>
        `;
      });
    }

    // POSTS DU FIL D'ACTUALITÉ
    function attachImageToPost(e) {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(evt) {
          tempPostImage = evt.target.result;
          document.getElementById('post-image-preview').src = tempPostImage;
          document.getElementById('post-image-preview-box').classList.remove('hidden');
        };
        reader.readAsDataURL(file);
      }
    }

    function removePostImage() {
      tempPostImage = null;
      document.getElementById('post-image-preview-box').classList.add('hidden');
    }

    function generateAIPost() {
      const suggestions = [
        "L'Intelligence Artificielle transforme notre manière d'interagir. 🚀",
        "Nouveau projet en cours avec l'équipe Google Dev ! 🇨🇩",
        "La technologie est le pont vers le futur de l'Afrique."
      ];
      document.getElementById('post-input').value = suggestions[Math.floor(Math.random() * suggestions.length)];
    }

    function publishPost() {
      const input = document.getElementById('post-input');
      const text = input.value.trim();
      if (!text && !tempPostImage) return;

      posts.unshift({
        id: Date.now(),
        author: user.name,
        avatar: user.avatar,
        content: text,
        image: tempPostImage,
        likes: 0,
        reactions: {},
        comments: [],
        time: 'À l\'instant'
      });

      localStorage.setItem('nexus_posts', JSON.stringify(posts));
      input.value = '';
      removePostImage();
      renderPosts();
    }

    function renderPosts() {
      const container = document.getElementById('posts-container');
      container.innerHTML = '';

      posts.forEach(p => {
        container.innerHTML += `
          <div class="bg-slate-900 border border-slate-800 p-3.5 rounded-2xl space-y-2.5">
            <div class="flex items-center justify-between">
              <div class="flex items-center gap-2.5">
                <img src="${p.avatar}" class="w-9 h-9 rounded-full border border-cyan-400 object-cover bg-slate-950">
                <div>
                  <h4 class="font-bold text-xs text-white flex items-center gap-1">${p.author} <i class="fa-solid fa-circle-check text-cyan-400 text-[9px]"></i></h4>
                  <p class="text-[9px] text-slate-500">${p.time}</p>
                </div>
              </div>
              <button onclick="deletePost(${p.id})" class="text-slate-600 hover:text-rose-500 text-xs"><i class="fa-solid fa-trash"></i></button>
            </div>
            
            ${p.content ? `<p class="text-xs text-slate-200 leading-relaxed">${p.content}</p>` : ''}
            ${p.image ? `<img src="${p.image}" class="w-full max-h-60 object-cover rounded-xl border border-slate-800">` : ''}

            <div class="flex justify-between items-center pt-2 border-t border-slate-800/60 text-slate-400 text-xs">
              <button onclick="likePost(${p.id})" class="hover:text-cyan-400 flex items-center gap-1 text-[11px]">
                <i class="fa-regular fa-thumbs-up"></i> J'aime (${p.likes})
              </button>
              <button onclick="startPVWith('${p.author}')" class="hover:text-cyan-400 flex items-center gap-1 text-[11px]">
                <i class="fa-regular fa-paper-plane"></i> Écrire en PV
              </button>
            </div>
          </div>
        `;
      });
    }

    function likePost(id) {
      const p = posts.find(x => x.id === id);
      if (p) { p.likes++; localStorage.setItem('nexus_posts', JSON.stringify(posts)); renderPosts(); }
    }

    function deletePost(id) {
      posts = posts.filter(x => x.id !== id);
      localStorage.setItem('nexus_posts', JSON.stringify(posts));
      renderPosts();
    }

    // MESSAGERIE / CHATS / ENREGISTREUR VOCAL
    function renderChatsList(filter = '') {
      const container = document.getElementById('chats-list');
      container.innerHTML = '';

      chats.filter(c => c.name.toLowerCase().includes(filter.toLowerCase())).forEach(c => {
        const lastMsg = c.messages[c.messages.length - 1];
        container.innerHTML += `
          <div onclick="openChatRoom('${c.id}')" class="flex items-center gap-3 p-3.5 hover:bg-slate-800/40 cursor-pointer transition">
            <img src="${c.avatar}" class="w-11 h-11 rounded-full border border-cyan-400 object-cover bg-slate-950">
            <div class="flex-1 min-w-0">
              <div class="flex justify-between items-center mb-0.5">
                <h2 class="font-bold text-xs text-white truncate">${c.name}</h2>
                <span class="text-[9px] text-cyan-400">${lastMsg ? lastMsg.time : ''}</span>
              </div>
              <p class="text-[11px] text-slate-400 truncate">${lastMsg ? (lastMsg.text || '🎵 Vocal envoyé') : 'Discussion'}</p>
            </div>
          </div>
        `;
      });
    }

    function filterChats(val) { renderChatsList(val); }

    function openChatRoom(id) {
      activeChatId = id;
      const chat = chats.find(c => c.id === id);
      if (!chat) return;

      document.getElementById('room-title').innerText = chat.name;
      document.getElementById('room-avatar').src = chat.avatar;
      document.getElementById('view-chat-room').classList.remove('hidden');

      renderMessages();
    }

    function closeChatRoom() {
      document.getElementById('view-chat-room').classList.add('hidden');
      renderChatsList();
    }

    function renderMessages() {
      const chat = chats.find(c => c.id === activeChatId);
      const box = document.getElementById('messages-box');
      box.innerHTML = '';

      chat.messages.forEach(m => {
        const isMe = m.sender === 'me';
        box.innerHTML += `
          <div class="flex items-end gap-2 ${isMe ? 'justify-end' : 'justify-start'}">
            ${!isMe ? `<img src="${chat.avatar}" class="w-6 h-6 rounded-full border border-cyan-400 object-cover bg-slate-950">` : ''}
            <div class="flex flex-col gap-1 max-w-[80%] ${isMe ? 'meta-gradient text-white' : 'bg-slate-900 border border-slate-800 text-slate-200'} p-2.5 rounded-2xl text-xs shadow-md">
              
              ${m.text ? `<p class="break-words">${m.text}</p>` : ''}
              ${m.image ? `<img src="${m.image}" class="w-full max-h-48 object-cover rounded-xl mt-1">` : ''}
              ${m.audio ? `
                <div class="flex items-center gap-2 py-1">
                  <i class="fa-solid fa-play text-cyan-300 cursor-pointer" onclick="this.nextElementSibling.play()"></i>
                  <audio class="hidden"><source src="${m.audio}"></audio>
                  <span class="text-[10px] italic">Message vocal</span>
                </div>
              ` : ''}

              <div class="flex justify-between items-center text-[8px] font-mono ${isMe ? 'text-cyan-100' : 'text-slate-500'}">
                <span>${m.time}</span>
                ${m.text && !isMe ? `<i class="fa-solid fa-volume-high cursor-pointer ml-2 hover:text-white" onclick="speakText('${m.text.replace(/'/g, "\\'")}')"></i>` : ''}
              </div>
            </div>
            ${isMe ? `<img src="${user.avatar}" class="w-6 h-6 rounded-full border border-cyan-400 object-cover bg-slate-950">` : ''}
          </div>
        `;
      });

      box.scrollTop = box.scrollHeight;
    }

    function sendMessage(e) {
      e.preventDefault();
      const input = document.getElementById('chat-input');
      const text = input.value.trim();

      if (!text && !tempChatImage) return;

      const chat = chats.find(c => c.id === activeChatId);
      const now = new Date();
      const timeStr = `${now.getHours()}:${now.getMinutes() < 10 ? '0' : ''}${now.getMinutes()}`;

      // COMMANDE /IMAGE DANS CHAT
      if (text.startsWith('/image ')) {
        const query = encodeURIComponent(text.replace('/image ', ''));
        tempChatImage = `https://image.pollinations.ai/prompt/${query}?width=500&height=500&nologo=true`;
      }

      chat.messages.push({
        sender: 'me',
        text: text.startsWith('/image ') ? '🖼️ Image générée par IA :' : text,
        image: tempChatImage,
        time: timeStr
      });

      input.value = '';
      clearChatImage();
      localStorage.setItem('nexus_chats', JSON.stringify(chats));
      renderMessages();

      // RÉPONSE DE L'IA NEO
      if (chat.type === 'bot') {
        setTimeout(() => {
          let reply = "Je suis l'assistant IA NEO. Comment puis-je t'aider ?";
          const t = text.toLowerCase();
          if (t.includes('créateur') || t.includes('createur')) reply = "J'ai été créé par Célestin 🇨🇩 !";
          else if (t.includes('salut') || t.includes('bonjour')) reply = `Bonjour ${user.name} ! Ravi de te parler.`;

          chat.messages.push({ sender: 'bot', text: reply, time: timeStr });
          localStorage.setItem('nexus_chats', JSON.stringify(chats));
          renderMessages();
        }, 700);
      }
    }

    function attachImageToChat(e) {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(evt) {
          tempChatImage = evt.target.result;
          document.getElementById('chat-img-preview').src = tempChatImage;
          document.getElementById('chat-img-preview-box').classList.remove('hidden');
        };
        reader.readAsDataURL(file);
      }
    }

    function clearChatImage() {
      tempChatImage = null;
      document.getElementById('chat-img-preview-box').classList.add('hidden');
    }

    async function toggleVoiceRecord() {
      const micIcon = document.getElementById('mic-icon');
      if (!isRecording) {
        try {
          const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
          mediaRecorder = new MediaRecorder(stream);
          audioChunks = [];
          mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
          mediaRecorder.onstop = () => {
            const blob = new Blob(audioChunks, { type: 'audio/mp3' });
            sendAudioMessage(URL.createObjectURL(blob));
          };
          mediaRecorder.start();
          isRecording = true;
          micIcon.className = "fa-solid fa-stop text-rose-500 animate-pulse";
        } catch (err) { alert("Microphone non autorisé."); }
      } else {
        mediaRecorder.stop();
        isRecording = false;
        micIcon.className = "fa-solid fa-microphone";
      }
    }

    function sendAudioMessage(url) {
      const chat = chats.find(c => c.id === activeChatId);
      const now = new Date();
      const timeStr = `${now.getHours()}:${now.getMinutes() < 10 ? '0' : ''}${now.getMinutes()}`;
      chat.messages.push({ sender: 'me', audio: url, time: timeStr });
      localStorage.setItem('nexus_chats', JSON.stringify(chats));
      renderMessages();
    }

    function speakText(txt) {
      const utterance = new SpeechSynthesisUtterance(txt);
      utterance.lang = 'fr-FR';
      window.speechSynthesis.speak(utterance);
    }

    function triggerCall(type) { alert(`Appel ${type} en cours...`); }

    // CRÉATION DE GROUPES ET PV (SANS PROMPT)
    function createGroupSubmit() {
      const name = document.getElementById('group-name-input').value.trim();
      if (name) {
        chats.push({
          id: 'group_' + Date.now(),
          name: 'Groupe : ' + name,
          avatar: `https://api.dicebear.com/7.x/identicon/svg?seed=${name}`,
          type: 'group',
          messages: [{ sender: 'other', text: `Groupe "${name}" créé par ${user.name} !`, time: 'À l\'instant' }]
        });
        localStorage.setItem('nexus_chats', JSON.stringify(chats));
        closeModal('modal-group');
        renderChatsList();
        switchTab('chats');
      }
    }

    function createPVSubmit() {
      const name = document.getElementById('pv-name-input').value.trim();
      if (name) {
        startPVWith(name);
        closeModal('modal-pv');
      }
    }

    function startPVWith(name) {
      let chat = chats.find(c => c.name.toLowerCase().includes(name.toLowerCase()));
      if (!chat) {
        chat = {
          id: 'pv_' + Date.now(),
          name: name + ' (PV)',
          avatar: `https://api.dicebear.com/7.x/identicon/svg?seed=${name}`,
          type: 'pv',
          messages: [{ sender: 'other', text: `Discussion PV avec ${name}.`, time: 'À l\'instant' }]
        };
        chats.push(chat);
        localStorage.setItem('nexus_chats', JSON.stringify(chats));
        renderChatsList();
      }
      switchTab('chats');
      openChatRoom(chat.id);
    }

    // NAVIGATION
    function switchTab(tab) {
      if (tab === 'feed') {
        document.getElementById('tab-feed').classList.remove('hidden');
        document.getElementById('tab-chats').classList.add('hidden');
        document.getElementById('nav-btn-feed').className = "flex flex-col items-center gap-1 text-cyan-400";
        document.getElementById('nav-btn-chats').className = "flex flex-col items-center gap-1 text-slate-500 hover:text-cyan-400";
      } else {
        document.getElementById('tab-feed').classList.add('hidden');
        document.getElementById('tab-chats').classList.remove('hidden');
        document.getElementById('nav-btn-chats').className = "flex flex-col items-center gap-1 text-cyan-400";
        document.getElementById('nav-btn-feed').className = "flex flex-col items-center gap-1 text-slate-500 hover:text-cyan-400";
      }
    }
  </script>
</body>
</html>

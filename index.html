<!DOCTYPE html>
<html lang="fr" class="h-full bg-slate-950">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Nexus Social & Marketplace</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>

  <style>
    * { font-family: 'Plus Jakarta Sans', sans-serif; }
    .chat-scroll::-webkit-scrollbar { width: 3px; }
    .chat-scroll::-webkit-scrollbar-thumb { background: #00d9ff; border-radius: 10px; }
    .meta-gradient { background: linear-gradient(135deg, #0066ff, #00d9ff); }
    .story-ring { background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888); }
    .emoji-pop:hover { transform: scale(1.3); transition: transform 0.2s ease; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="h-full text-slate-100 flex justify-center items-center bg-slate-950 antialiased select-none">

  <div class="w-full max-w-md h-full md:h-[95vh] md:rounded-3xl bg-slate-900 border border-cyan-500/20 shadow-2xl flex flex-col overflow-hidden relative">

    <div id="view-auth" class="absolute inset-0 z-50 bg-slate-950 p-6 flex flex-col justify-center items-center space-y-4">
      <div class="text-center space-y-2">
        <div class="w-16 h-16 meta-gradient rounded-2xl flex items-center justify-center mx-auto shadow-lg shadow-cyan-500/30">
          <i class="fa-solid fa-share-nodes text-3xl text-white"></i>
        </div>
        <h2 class="text-2xl font-extrabold text-white">Nexus Social</h2>
        <p class="text-xs text-slate-400">Réseau & Marketplace Multi-utilisateurs</p>
      </div>

      <div class="w-full space-y-3 bg-slate-900 p-4 rounded-2xl border border-slate-800">
        <input type="text" id="auth-username" placeholder="Pseudo / Nom complet" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2.5 text-xs text-white focus:outline-none focus:border-cyan-400">
        <input type="text" id="auth-domain" placeholder="Domaine / Profession" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2.5 text-xs text-white focus:outline-none focus:border-cyan-400">

        <button onclick="loginUser()" class="w-full py-2.5 meta-gradient rounded-xl text-xs font-bold text-white shadow-lg">Entrer sur le réseau</button>
      </div>
    </div>

    <header class="bg-slate-900/95 border-b border-slate-800 p-3.5 flex items-center justify-between sticky top-0 z-30 backdrop-blur-md">
      <div class="flex items-center gap-3">
        <div class="relative cursor-pointer" onclick="openProfileSettings()">
          <img id="header-avatar" src="https://api.dicebear.com/7.x/bottts/svg?seed=guest" class="w-10 h-10 rounded-full border-2 border-cyan-400 object-cover bg-slate-950">
          <span class="absolute bottom-0 right-0 w-3 h-3 bg-emerald-500 rounded-full border-2 border-slate-900"></span>
        </div>
        <div>
          <h1 class="font-bold text-xs text-white flex items-center gap-1">
            <span id="header-user-name">Chargement...</span>
            <i class="fa-solid fa-circle-check text-cyan-400 text-[10px]"></i>
          </h1>
          <p id="header-user-role" class="text-[10px] text-cyan-400 font-mono">Général</p>
        </div>
      </div>
      <div class="flex items-center gap-2">
        <button onclick="shareInviteLink()" class="w-8 h-8 rounded-xl bg-slate-800/80 border border-slate-700 text-cyan-400 flex items-center justify-center hover:bg-slate-700 transition">
          <i class="fa-solid fa-share-nodes"></i>
        </button>
        <button onclick="openModal('modal-group')" class="text-xs bg-slate-800/80 border border-slate-700 hover:border-cyan-500 text-slate-200 px-3 py-1.5 rounded-xl flex items-center gap-1.5 transition">
          <i class="fa-solid fa-users text-cyan-400"></i>
          <span>+ Groupe</span>
        </button>
      </div>
    </header>

    <main id="tab-feed" class="flex-1 overflow-y-auto chat-scroll p-3 space-y-3">
      
      <div class="flex gap-2 overflow-x-auto no-scrollbar pb-2 items-center">
        <div onclick="addStory()" class="flex-shrink-0 w-20 h-28 bg-slate-950 border border-slate-800 rounded-xl relative overflow-hidden cursor-pointer flex flex-col justify-end p-2 text-center">
          <i class="fa-solid fa-plus text-cyan-400 text-lg mb-4 mx-auto"></i>
          <span class="text-[9px] font-bold text-slate-300">Ajouter</span>
        </div>
        <div id="stories-container" class="flex gap-2 min-w-0"></div>
      </div>

      <div class="bg-slate-900 border border-slate-800 p-3 rounded-2xl space-y-3 shadow-lg">
        <div class="flex items-center gap-2">
          <img id="post-user-avatar" src="https://api.dicebear.com/7.x/bottts/svg?seed=guest" class="w-8 h-8 rounded-full border border-cyan-400 object-cover">
          <input type="text" id="post-input" placeholder="Quoi de neuf aujourd'hui ?" class="flex-1 bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-cyan-400">
        </div>

        <div id="post-image-preview-box" class="hidden relative rounded-xl overflow-hidden border border-slate-800">
          <img id="post-image-preview" src="" class="w-full max-h-48 object-cover">
          <button onclick="removePostImage()" class="absolute top-2 right-2 bg-black/70 text-white w-6 h-6 rounded-full text-xs">✕</button>
        </div>

        <div class="flex justify-between items-center pt-2 border-t border-slate-800/80">
          <label for="post-file-input" class="hover:text-cyan-400 cursor-pointer flex items-center gap-1 text-[11px] text-slate-400">
            <i class="fa-solid fa-image text-emerald-400"></i> Photo
          </label>
          <input type="file" id="post-file-input" accept="image/*" class="hidden" onchange="attachImageToPost(event)">

          <button onclick="publishPost()" class="px-4 py-1.5 meta-gradient rounded-xl text-xs font-bold text-white shadow-md active:scale-95 transition">
            Publier
          </button>
        </div>
      </div>

      <div class="relative">
        <input type="text" id="search-feed-input" oninput="filterFeed(this.value)" placeholder="Rechercher des posts ou mots-clés..." class="w-full bg-slate-950 border border-slate-800 rounded-xl pl-8 pr-3 py-1.5 text-xs text-white focus:outline-none focus:border-cyan-400">
        <i class="fa-solid fa-magnifying-glass absolute left-3 top-2.5 text-slate-500 text-xs"></i>
      </div>

      <div id="posts-container" class="space-y-3"></div>
    </main>

    <main id="tab-market" class="hidden flex-1 overflow-y-auto chat-scroll p-3 space-y-3">
      <div class="flex justify-between items-center bg-slate-900 p-3 rounded-2xl border border-slate-800">
        <h2 class="font-bold text-xs text-white flex items-center gap-2">
          <i class="fa-solid fa-store text-cyan-400"></i> Marché Nexus
        </h2>
        <button onclick="openModal('modal-market')" class="px-3 py-1.5 meta-gradient text-[10px] font-bold rounded-xl text-white">
          + Vendre un article
        </button>
      </div>

      <div id="market-container" class="grid grid-cols-2 gap-2.5"></div>
    </main>

    <main id="tab-chats" class="hidden flex-1 overflow-y-auto chat-scroll">
      <div class="p-3 border-b border-slate-800/80 bg-slate-950/40 space-y-2">
        <div class="relative">
          <i class="fa-solid fa-magnifying-glass absolute left-3 top-2.5 text-slate-500 text-xs"></i>
          <input type="text" id="search-user-input" oninput="searchUsersAndChats(this.value)" placeholder="Rechercher un membre ou un groupe..." class="w-full bg-slate-900 border border-slate-800 rounded-xl pl-8 pr-3 py-1.5 text-xs text-white focus:outline-none focus:border-cyan-400">
        </div>
      </div>

      <div id="search-results" class="p-2 space-y-1 hidden bg-slate-950/80 border-b border-slate-800"></div>
      <div id="chats-list" class="divide-y divide-slate-800/40"></div>
    </main>

    <div id="view-chat-room" class="hidden absolute inset-0 z-40 bg-slate-950 flex flex-col">
      <div class="bg-slate-900 border-b border-slate-800 p-3 flex items-center justify-between">
        <div class="flex items-center gap-2.5">
          <button onclick="closeChatRoom()" class="text-slate-400 hover:text-white p-1">
            <i class="fa-solid fa-arrow-left"></i>
          </button>
          <img id="room-avatar" src="" class="w-9 h-9 rounded-full border border-cyan-400 object-cover bg-slate-950">
          <div>
            <h3 id="room-title" class="font-bold text-xs text-white">Discussion</h3>
            <p class="text-[9px] text-emerald-400 font-mono">En ligne</p>
          </div>
        </div>
      </div>

      <div id="messages-box" class="flex-1 p-3 overflow-y-auto space-y-2.5 chat-scroll"></div>

      <form onsubmit="sendMessage(event)" class="p-2.5 bg-slate-900 border-t border-slate-800 flex items-center gap-2">
        <input type="text" id="chat-input" placeholder="Message..." class="flex-1 bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-cyan-400">
        <button type="submit" class="w-9 h-9 rounded-xl meta-gradient text-white flex items-center justify-center text-xs shadow-lg">
          <i class="fa-solid fa-paper-plane"></i>
        </button>
      </form>
    </div>

    <nav class="bg-slate-900 border-t border-slate-800 py-2.5 px-4 flex justify-around items-center sticky bottom-0 z-30">
      <button onclick="switchTab('feed')" id="nav-btn-feed" class="flex flex-col items-center gap-1 text-cyan-400">
        <i class="fa-solid fa-newspaper text-base"></i>
        <span class="text-[9px] font-bold">Accueil</span>
      </button>

      <button onclick="switchTab('market')" id="nav-btn-market" class="flex flex-col items-center gap-1 text-slate-500 hover:text-cyan-400">
        <i class="fa-solid fa-store text-base"></i>
        <span class="text-[9px] font-bold">Marché</span>
      </button>

      <button onclick="switchTab('chats')" id="nav-btn-chats" class="flex flex-col items-center gap-1 text-slate-500 hover:text-cyan-400">
        <i class="fa-solid fa-comments text-base"></i>
        <span class="text-[9px] font-bold">Messages</span>
      </button>

      <button onclick="openProfileSettings()" class="flex flex-col items-center gap-1 text-slate-500 hover:text-cyan-400">
        <i class="fa-solid fa-gear text-base"></i>
        <span class="text-[9px] font-bold">Profil</span>
      </button>
    </nav>

    <div id="modal-settings" class="hidden absolute inset-0 z-50 bg-slate-950/95 p-6 flex flex-col justify-center items-center backdrop-blur-md">
      <div class="w-full max-w-sm bg-slate-900 border border-slate-800 rounded-3xl p-5 space-y-4 shadow-2xl">
        <div class="flex justify-between items-center border-b border-slate-800 pb-2">
          <h3 class="font-bold text-sm text-white">Éditer le profil</h3>
          <button onclick="closeModal('modal-settings')" class="text-slate-400">✕</button>
        </div>
        <div class="flex flex-col items-center gap-2">
          <img id="avatar-preview" src="" class="w-20 h-20 rounded-full border-2 border-cyan-400 object-cover bg-slate-950">
          <label for="avatar-file-input" class="text-[10px] text-cyan-400 font-semibold cursor-pointer hover:underline">Changer la photo</label>
          <input type="file" id="avatar-file-input" accept="image/*" class="hidden" onchange="loadAvatarFromGallery(event)">
        </div>
        <div class="space-y-3">
          <input type="text" id="username-input" placeholder="Pseudo" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-white focus:outline-none">
          <input type="text" id="domain-input" placeholder="Domaine" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-white focus:outline-none">
        </div>
        <button onclick="saveUserProfile()" class="w-full py-2.5 meta-gradient rounded-xl text-xs font-bold text-white shadow-lg">Enregistrer</button>
      </div>
    </div>

    <div id="modal-market" class="hidden absolute inset-0 z-50 bg-slate-950/95 p-6 flex flex-col justify-center items-center backdrop-blur-md">
      <div class="w-full max-w-sm bg-slate-900 border border-slate-800 rounded-3xl p-5 space-y-3">
        <div class="flex justify-between items-center border-b border-slate-800 pb-2">
          <h3 class="font-bold text-sm text-white">Vendre un article</h3>
          <button onclick="closeModal('modal-market')" class="text-slate-400">✕</button>
        </div>
        <input type="text" id="market-title" placeholder="Titre de l'article" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-white focus:outline-none">
        <input type="text" id="market-price" placeholder="Prix (ex: 50$)" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-white focus:outline-none">
        <input type="text" id="market-img" placeholder="URL de l'image du produit" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-white focus:outline-none">
        <button onclick="publishMarketItem()" class="w-full py-2.5 meta-gradient rounded-xl text-xs font-bold text-white">Publier l'annonce</button>
      </div>
    </div>

    <div id="modal-group" class="hidden absolute inset-0 z-50 bg-slate-950/95 p-6 flex flex-col justify-center items-center backdrop-blur-md">
      <div class="w-full max-w-sm bg-slate-900 border border-slate-800 rounded-3xl p-5 space-y-4">
        <div class="flex justify-between items-center border-b border-slate-800 pb-2">
          <h3 class="font-bold text-sm text-white">Nouveau Groupe</h3>
          <button onclick="closeModal('modal-group')" class="text-slate-400">✕</button>
        </div>
        <input type="text" id="group-name-input" placeholder="Nom du groupe..." class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-white focus:outline-none">
        <button onclick="createGroupSubmit()" class="w-full py-2.5 meta-gradient rounded-xl text-xs font-bold text-white">Créer le Groupe</button>
      </div>
    </div>

  </div>

  <script>
    // Configuration Firebase Firestore
    const firebaseConfig = {
      apiKey: "AIzaSy_REPLACE_WITH_YOUR_KEY",
      authDomain: "nexus-app.firebaseapp.com",
      projectId: "nexus-app",
      storageBucket: "nexus-app.appspot.com",
      messagingSenderId: "1234567890",
      appId: "1:1234567890:web:abcdef123456"
    };

    let db = null;
    try {
      if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
      db = firebase.firestore();
    } catch(e) {
      console.error("Firebase Initialization Error", e);
    }

    let currentUser = JSON.parse(localStorage.getItem('nexus_user')) || null;
    let posts = [];
    let marketItems = [];
    let stories = [];
    let chats = [];
    let allRegisteredUsers = [];
    let tempPostImage = null;
    let activeChatId = null;

    document.addEventListener('DOMContentLoaded', () => {
      if (currentUser) {
        document.getElementById('view-auth').classList.add('hidden');
        applyUserProfile();
        initRealtimeSync();
      }
    });

    // Synchronisation en temps réel Firebase
    function initRealtimeSync() {
      if (!db) return;

      // Sync Posts
      db.collection('posts').orderBy('timestamp', 'desc').onSnapshot(snapshot => {
        posts = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
        renderPosts();
      });

      // Sync Stories
      db.collection('stories').orderBy('timestamp', 'desc').onSnapshot(snapshot => {
        stories = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
        renderStories();
      });

      // Sync Marketplace
      db.collection('market').orderBy('timestamp', 'desc').onSnapshot(snapshot => {
        marketItems = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
        renderMarket();
      });

      // Sync Chats / Groupes
      db.collection('chats').onSnapshot(snapshot => {
        chats = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
        renderChatsList();
        if (activeChatId) renderMessages();
      });

      // Sync Utilisateurs pour la recherche
      db.collection('users').onSnapshot(snapshot => {
        allRegisteredUsers = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
      });
    }

    function loginUser() {
      const username = document.getElementById('auth-username').value.trim() || 'Membre';
      const domain = document.getElementById('auth-domain').value.trim() || 'Général';

      currentUser = {
        id: 'usr_' + Date.now(),
        username: username,
        domain: domain,
        avatar: `https://api.dicebear.com/7.x/bottts/svg?seed=${encodeURIComponent(username)}`
      };

      localStorage.setItem('nexus_user', JSON.stringify(currentUser));
      if (db) db.collection('users').doc(currentUser.id).set(currentUser);

      document.getElementById('view-auth').classList.add('hidden');
      applyUserProfile();
      initRealtimeSync();
    }

    function applyUserProfile() {
      if (!currentUser) return;
      document.getElementById('header-user-name').innerText = currentUser.username;
      document.getElementById('header-user-role').innerText = currentUser.domain;
      document.getElementById('header-avatar').src = currentUser.avatar;
      document.getElementById('post-user-avatar').src = currentUser.avatar;
    }

    // STORIES
    function addStory() {
      const newStory = {
        user: currentUser.username,
        avatar: currentUser.avatar,
        timestamp: firebase.firestore.FieldValue.serverTimestamp()
      };
      if (db) db.collection('stories').add(newStory);
    }

    function renderStories() {
      const container = document.getElementById('stories-container');
      container.innerHTML = '';
      stories.forEach(s => {
        container.innerHTML += `
          <div class="flex-shrink-0 w-20 h-28 story-ring p-0.5 rounded-xl cursor-pointer">
            <div class="w-full h-full bg-slate-950 rounded-[10px] overflow-hidden relative flex flex-col justify-end p-1.5">
              <img src="${s.avatar}" class="w-6 h-6 rounded-full border border-cyan-400 absolute top-1.5 left-1.5 object-cover">
              <span class="text-[9px] font-bold text-white truncate w-full block text-center">${s.user}</span>
            </div>
          </div>
        `;
      });
    }

    // POSTS
    function attachImageToPost(e) {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(evt) {
          tempPostImage = evt.target.result;
          document.getElementById('post-image-preview').src = tempPostImage;
          document.getElementById('post-image-preview-box').classList.remove('hidden');
        };
        reader.readAsDataURL(file);
      }
    }

    function removePostImage() {
      tempPostImage = null;
      document.getElementById('post-image-preview-box').classList.add('hidden');
    }

    function publishPost() {
      const text = document.getElementById('post-input').value.trim();
      if (!text && !tempPostImage) return;

      const newPost = {
        author: currentUser.username,
        domain: currentUser.domain,
        avatar: currentUser.avatar,
        content: text,
        image: tempPostImage,
        totalReactions: 0,
        shares: 0,
        comments: [],
        timestamp: firebase.firestore.FieldValue.serverTimestamp()
      };

      if (db) db.collection('posts').add(newPost);

      document.getElementById('post-input').value = '';
      removePostImage();
    }

    function renderPosts(filteredPosts = null) {
      const container = document.getElementById('posts-container');
      container.innerHTML = '';
      const list = filteredPosts || posts;

      list.forEach(p => {
        container.innerHTML += `
          <div class="bg-slate-900 border border-slate-800 p-3.5 rounded-2xl space-y-3">
            <div class="flex items-center gap-2.5">
              <img src="${p.avatar}" class="w-9 h-9 rounded-full border border-cyan-400 object-cover bg-slate-950">
              <div>
                <h4 class="font-bold text-xs text-white">${p.author}</h4>
                <p class="text-[9px] text-cyan-400">${p.domain}</p>
              </div>
            </div>

            ${p.content ? `<p class="text-xs text-slate-200">${p.content}</p>` : ''}
            ${p.image ? `<img src="${p.image}" class="w-full max-h-60 object-cover rounded-xl border border-slate-800">` : ''}

            <div class="flex justify-between items-center pt-2 border-t border-slate-800/60 text-xs text-slate-400">
              <div class="flex gap-2 text-base">
                <span onclick="reactToPost('${p.id}')" class="cursor-pointer emoji-pop">👍</span>
                <span onclick="reactToPost('${p.id}')" class="cursor-pointer emoji-pop">❤️</span>
                <span onclick="reactToPost('${p.id}')" class="cursor-pointer emoji-pop">😂</span>
              </div>
              <div class="flex gap-2 text-[10px]">
                <span>${p.totalReactions || 0} Réactions</span>
                <span>•</span>
                <button onclick="sharePost('${p.id}')" class="hover:text-cyan-400"><i class="fa-solid fa-share"></i> Partager (${p.shares || 0})</button>
              </div>
            </div>

            <div class="space-y-1">
              ${(p.comments || []).map(c => `
                <div class="bg-slate-950 p-1.5 rounded-lg text-[10px]">
                  <span class="font-bold text-cyan-400">${c.author}:</span> ${c.text}
                </div>
              `).join('')}
              <div class="flex gap-1.5 pt-1">
                <input type="text" id="comment-input-${p.id}" placeholder="Écrire un commentaire..." class="flex-1 bg-slate-950 border border-slate-800 rounded-lg px-2 py-1 text-[10px] text-white focus:outline-none">
                <button onclick="addComment('${p.id}')" class="px-2 py-1 meta-gradient text-[9px] font-bold rounded-lg text-white">Envoyer</button>
              </div>
            </div>
          </div>
        `;
      });
    }

    function filterFeed(query) {
      if (!query.trim()) {
        renderPosts();
        return;
      }
      const filtered = posts.filter(p => 
        (p.content && p.content.toLowerCase().includes(query.toLowerCase())) || 
        (p.author && p.author.toLowerCase().includes(query.toLowerCase()))
      );
      renderPosts(filtered);
    }

    function reactToPost(id) {
      if (db) {
        db.collection('posts').doc(id).update({
          totalReactions: firebase.firestore.FieldValue.increment(1)
        });
      }
    }

    function addComment(id) {
      const input = document.getElementById(`comment-input-${id}`);
      const text = input.value.trim();
      if (!text) return;

      if (db) {
        db.collection('posts').doc(id).update({
          comments: firebase.firestore.FieldValue.arrayUnion({ author: currentUser.username, text: text })
        });
      }
      input.value = '';
    }

    function sharePost(id) {
      const post = posts.find(p => p.id === id);
      if (post) {
        if (db) {
          db.collection('posts').doc(id).update({
            shares: firebase.firestore.FieldValue.increment(1)
          });
          db.collection('posts').add({
            author: currentUser.username,
            domain: currentUser.domain,
            avatar: currentUser.avatar,
            content: `🔄 Partagé de @${post.author} : "${post.content || ''}"`,
            image: post.image || null,
            totalReactions: 0,
            shares: 0,
            comments: [],
            timestamp: firebase.firestore.FieldValue.serverTimestamp()
          });
        }
      }
    }

    // MARKETPLACE
    function publishMarketItem() {
      const title = document.getElementById('market-title').value.trim();
      const price = document.getElementById('market-price').value.trim();
      const img = document.getElementById('market-img').value.trim() || 'https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=300';

      if (!title || !price) return;

      const newItem = {
        title, price, img, seller: currentUser.username,
        timestamp: firebase.firestore.FieldValue.serverTimestamp()
      };

      if (db) db.collection('market').add(newItem);
      closeModal('modal-market');
    }

    function renderMarket() {
      const container = document.getElementById('market-container');
      container.innerHTML = '';
      marketItems.forEach(m => {
        container.innerHTML += `
          <div class="bg-slate-900 border border-slate-800 rounded-2xl overflow-hidden flex flex-col justify-between">
            <img src="${m.img}" class="w-full h-28 object-cover">
            <div class="p-2 space-y-1">
              <h4 class="font-bold text-xs text-white truncate">${m.title}</h4>
              <p class="text-cyan-400 font-bold text-xs">${m.price}</p>
              <p class="text-[9px] text-slate-400">Vendeur: ${m.seller}</p>
              <button onclick="startPV('${m.seller}', 'https://api.dicebear.com/7.x/bottts/svg?seed=${encodeURIComponent(m.seller)}')" class="w-full py-1 meta-gradient rounded-lg text-[9px] font-bold text-white mt-1">Contacter le vendeur</button>
            </div>
          </div>
        `;
      });
    }

    // RECHERCHE D'UTILISATEURS & MESSAGES
    function searchUsersAndChats(query) {
      const container = document.getElementById('search-results');
      if (!query.trim()) {
        container.classList.add('hidden');
        return;
      }
      container.classList.remove('hidden');
      container.innerHTML = '';

      const matchedUsers = allRegisteredUsers.filter(u => u.username.toLowerCase().includes(query.toLowerCase()) && u.username !== currentUser.username);
      
      if (matchedUsers.length === 0) {
        container.innerHTML = `<div class="p-2 text-xs text-slate-400 text-center">Aucun utilisateur trouvé</div>`;
        return;
      }

      matchedUsers.forEach(u => {
        container.innerHTML += `
          <div class="flex justify-between items-center p-2 bg-slate-900 rounded-xl">
            <div class="flex items-center gap-2">
              <img src="${u.avatar}" class="w-7 h-7 rounded-full object-cover">
              <div>
                <span class="text-xs font-bold text-white block">${u.username}</span>
                <span class="text-[9px] text-cyan-400">${u.domain}</span>
              </div>
            </div>
            <button onclick="startPV('${u.username}', '${u.avatar}')" class="px-2.5 py-1 meta-gradient text-[10px] rounded-lg font-bold text-white">Message PV</button>
          </div>
        `;
      });
    }

    function startPV(name, avatar) {
      let existingChat = chats.find(c => c.name === `PV : ${name}`);
      if (!existingChat) {
        const newChat = {
          name: `PV : ${name}`,
          avatar: avatar,
          messages: []
        };
        if (db) {
          db.collection('chats').add(newChat).then(docRef => {
            openChatRoom(docRef.id, newChat.name, newChat.avatar);
          });
        }
      } else {
        openChatRoom(existingChat.id, existingChat.name, existingChat.avatar);
      }
      document.getElementById('search-results').classList.add('hidden');
      switchTab('chats');
    }

    function renderChatsList() {
      const container = document.getElementById('chats-list');
      container.innerHTML = '';
      chats.forEach(c => {
        container.innerHTML += `
          <div onclick="openChatRoom('${c.id}', '${c.name}', '${c.avatar}')" class="flex items-center gap-3 p-3.5 hover:bg-slate-800/40 cursor-pointer transition">
            <img src="${c.avatar}" class="w-10 h-10 rounded-full border border-cyan-400 object-cover bg-slate-950">
            <div class="flex-1">
              <h2 class="font-bold text-xs text-white">${c.name}</h2>
              <p class="text-[10px] text-slate-400">Discussion active</p>
            </div>
          </div>
        `;
      });
    }

    function openChatRoom(id, name, avatar) {
      activeChatId = id;
      document.getElementById('room-title').innerText = name;
      document.getElementById('room-avatar').src = avatar;
      document.getElementById('view-chat-room').classList.remove('hidden');
      renderMessages();
    }

    function closeChatRoom() {
      document.getElementById('view-chat-room').classList.add('hidden');
      activeChatId = null;
    }

    function renderMessages() {
      const chat = chats.find(c => c.id === activeChatId);
      if (!chat) return;

      const box = document.getElementById('messages-box');
      box.innerHTML = '';
      (chat.messages || []).forEach(m => {
        const isMe = m.sender === currentUser.username;
        box.innerHTML += `
          <div class="flex flex-col ${isMe ? 'items-end' : 'items-start'}">
            <div class="max-w-[80%] ${isMe ? 'meta-gradient text-white' : 'bg-slate-900 text-slate-200 border border-slate-800'} p-2.5 rounded-2xl text-xs">
              ${!isMe ? `<span class="text-[9px] font-bold text-cyan-300 block mb-0.5">${m.sender}</span>` : ''}
              <p class="break-words">${m.text}</p>
            </div>
          </div>
        `;
      });
      box.scrollTop = box.scrollHeight;
    }

    function sendMessage(e) {
      e.preventDefault();
      const input = document.getElementById('chat-input');
      const text = input.value.trim();
      if (!text || !activeChatId) return;

      if (db) {
        db.collection('chats').doc(activeChatId).update({
          messages: firebase.firestore.FieldValue.arrayUnion({ sender: currentUser.username, text: text })
        });
      }
      input.value = '';
    }

    function createGroupSubmit() {
      const name = document.getElementById('group-name-input').value.trim();
      if (!name) return;

      const newGroup = {
        name: 'Groupe : ' + name,
        avatar: `https://api.dicebear.com/7.x/identicon/svg?seed=${encodeURIComponent(name)}`,
        messages: []
      };

      if (db) db.collection('chats').add(newGroup);
      closeModal('modal-group');
    }

    function openProfileSettings() {
      if (!currentUser) return;
      document.getElementById('username-input').value = currentUser.username;
      document.getElementById('domain-input').value = currentUser.domain;
      document.getElementById('avatar-preview').src = currentUser.avatar;
      openModal('modal-settings');
    }

    function saveUserProfile() {
      currentUser.username = document.getElementById('username-input').value;
      currentUser.domain = document.getElementById('domain-input').value;
      localStorage.setItem('nexus_user', JSON.stringify(currentUser));
      if (db) db.collection('users').doc(currentUser.id).set(currentUser);
      applyUserProfile();
      closeModal('modal-settings');
    }

    function loadAvatarFromGallery(e) {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(evt) {
          currentUser.avatar = evt.target.result;
          document.getElementById('avatar-preview').src = currentUser.avatar;
        };
        reader.readAsDataURL(file);
      }
    }

    function shareInviteLink() {
      navigator.clipboard.writeText(window.location.href).then(() => {
        alert("Lien d'invitation copié !");
      });
    }

    function openModal(id) { document.getElementById(id).classList.remove('hidden'); }
    function closeModal(id) { document.getElementById(id).classList.add('hidden'); }

    function switchTab(tab) {
      document.getElementById('tab-feed').classList.add('hidden');
      document.getElementById('tab-market').classList.add('hidden');
      document.getElementById('tab-chats').classList.add('hidden');

      document.getElementById('nav-btn-feed').className = "flex flex-col items-center gap-1 text-slate-500 hover:text-cyan-400";
      document.getElementById('nav-btn-market').className = "flex flex-col items-center gap-1 text-slate-500 hover:text-cyan-400";
      document.getElementById('nav-btn-chats').className = "flex flex-col items-center gap-1 text-slate-500 hover:text-cyan-400";

      if (tab === 'feed') {
        document.getElementById('tab-feed').classList.remove('hidden');
        document.getElementById('nav-btn-feed').className = "flex flex-col items-center gap-1 text-cyan-400";
      } else if (tab === 'market') {
        document.getElementById('tab-market').classList.remove('hidden');
        document.getElementById('nav-btn-market').className = "flex flex-col items-center gap-1 text-cyan-400";
      } else if (tab === 'chats') {
        document.getElementById('tab-chats').classList.remove('hidden');
        document.getElementById('nav-btn-chats').className = "flex flex-col items-center gap-1 text-cyan-400";
      }
    }
  </script>
</body>
</html>

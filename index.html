<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VP Dev App</title>
  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
  <style>
    :root {
      --bg-dark: #0a0a0c;
      --card-bg: #121318;
      --accent-blue: #0070f3;
      --accent-blue-hover: #0051a8;
      --text-color: #ffffff;
      --text-muted: #a0a0a0;
      --border-color: #1f222e;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-color);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    /* En-tête / Logo VP */
    header {
      width: 100%;
      max-width: 500px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
    }

    .logo {
      font-size: 28px;
      font-weight: 900;
      color: var(--text-color);
      letter-spacing: 2px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .logo span {
      background-color: var(--accent-blue);
      color: #fff;
      padding: 4px 10px;
      border-radius: 8px;
      box-shadow: 0 0 15px rgba(0, 112, 243, 0.4);
    }

    /* Cartes */
    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      width: 100%;
      max-width: 500px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
    }

    .hidden {
      display: none !important;
    }

    h2 {
      font-size: 16px;
      margin-bottom: 15px;
      color: var(--accent-blue);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    /* Formulaires */
    .form-group {
      margin-bottom: 15px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    label {
      font-size: 13px;
      color: var(--text-muted);
    }

    input {
      width: 100%;
      padding: 12px;
      background-color: #060608;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      color: #fff;
      font-size: 14px;
      outline: none;
    }

    input:focus {
      border-color: var(--accent-blue);
    }

    /* Photo de profil galerie */
    .profile-upload {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      margin-bottom: 15px;
    }

    .avatar-preview {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      border: 2px solid var(--accent-blue);
      object-fit: cover;
      background-color: #000;
    }

    .file-btn {
      background-color: #1a1c23;
      border: 1px solid var(--border-color);
      color: var(--text-color);
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 12px;
      cursor: pointer;
    }

    input[type="file"] { display: none; }

    /* Boutons */
    .btn {
      width: 100%;
      padding: 12px;
      background-color: var(--accent-blue);
      border: none;
      border-radius: 8px;
      color: #fff;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn:hover { background-color: var(--accent-blue-hover); }

    /* Zone de Chat */
    .chat-box {
      height: 250px;
      overflow-y: auto;
      border: 1px solid var(--border-color);
      background-color: #060608;
      border-radius: 8px;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 10px;
    }

    .msg {
      background-color: #1f222e;
      padding: 8px 12px;
      border-radius: 8px;
      max-width: 80%;
      font-size: 13px;
      align-self: flex-start;
    }

    .msg.me {
      align-self: flex-end;
      background-color: var(--accent-blue);
    }

    .msg-author {
      font-size: 10px;
      color: #aaa;
      display: block;
      margin-bottom: 2px;
    }

    .chat-input-group {
      display: flex;
      gap: 8px;
    }
  </style>
</head>
<body>

  <header>
    <div class="logo">
      <span>VP</span> DEV
    </div>
  </header>

  <div class="card" id="authSection">
    <h2>Connexion / Inscription</h2>
    <form id="authForm">
      <div class="profile-upload">
        <img src="https://via.placeholder.com/80/121318/a0a0a0?text=Avatar" id="avatarPreview" class="avatar-preview">
        <label for="galleryInput" class="file-btn">Choisir photo depuis la galerie</label>
        <input type="file" id="galleryInput" accept="image/*">
      </div>

      <div class="form-group">
        <label>Pseudo Développeur</label>
        <input type="text" id="username" placeholder="ex: Dev_Master" required>
      </div>

      <div class="form-group">
        <label>Adresse E-mail</label>
        <input type="email" placeholder="dev@exemple.com" required>
      </div>

      <button type="submit" class="btn">Rejoindre l'application</button>
    </form>
  </div>

  <div id="appSection" class="hidden">
    
    <div class="card">
      <h2>Créer ou Rejoindre un Groupe</h2>
      <div class="form-group">
        <input type="text" id="groupNameInput" placeholder="Nom du groupe (ex: React Devs)">
      </div>
      <button onclick="joinGroup()" class="btn">Rejoindre le Groupe</button>
    </div>

    <div class="card">
      <h2>Discussion en temps réel (<span id="currentGroup">Général</span>)</h2>
      <div class="chat-box" id="chatBox"></div>
      
      <form id="chatForm" class="chat-input-group">
        <input type="text" id="messageInput" placeholder="Écris un message..." required>
        <button type="submit" class="btn" style="width: auto; padding: 0 20px;">Envoyer</button>
      </form>
    </div>

  </div>

  <script>
    // Connexion au serveur WebSocket (Remplace l'adresse si ton serveur est en ligne)
    const socket = io('http://localhost:3000'); 

    let currentUser = { name: '', avatar: '' };
    let activeGroup = 'Général';

    // 1. Gestion de la Photo issue de la Galerie
    const galleryInput = document.getElementById('galleryInput');
    const avatarPreview = document.getElementById('avatarPreview');

    galleryInput.addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(event) {
          avatarPreview.src = event.target.result;
          currentUser.avatar = event.target.result;
        };
        reader.readAsDataURL(file);
      }
    });

    // 2. Soumission du Profil / Connexion
    document.getElementById('authForm').addEventListener('submit', function(e) {
      e.preventDefault();
      currentUser.name = document.getElementById('username').value;
      
      // Masquer la connexion et afficher l'application
      document.getElementById('authSection').classList.add('hidden');
      document.getElementById('appSection').classList.remove('hidden');

      // Rejoindre le canal par défaut
      socket.emit('join_group', activeGroup);
    });

    // 3. Changement/Création de groupe
    function joinGroup() {
      const input = document.getElementById('groupNameInput');
      if (input.value.trim() !== '') {
        activeGroup = input.value.trim();
        document.getElementById('currentGroup').textContent = activeGroup;
        document.getElementById('chatBox').innerHTML = ''; // Réinitialiser le tchat
        socket.emit('join_group', activeGroup);
        input.value = '';
      }
    }

    // 4. Envoi de Message Réel
    document.getElementById('chatForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const input = document.getElementById('messageInput');
      
      if (input.value.trim() !== '') {
        const msgData = {
          user: currentUser.name,
          text: input.value,
          group: activeGroup
        };

        socket.emit('send_message', msgData);
        input.value = '';
      }
    });

    // 5. Réception des Messages Instantanés
    socket.on('receive_message', function(data) {
      const chatBox = document.getElementById('chatBox');
      const msgDiv = document.createElement('div');
      msgDiv.classList.add('msg');

      if (data.user === currentUser.name) {
        msgDiv.classList.add('me');
      }

      msgDiv.innerHTML = `<span class="msg-author">${data.user}</span>${data.text}`;
      chatBox.appendChild(msgDiv);
      chatBox.scrollTop = chatBox.scrollHeight;
    });
  </script>

</body>
</html>

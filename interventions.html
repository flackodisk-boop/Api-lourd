<!DOCTYPE html>
<html lang="fr" class="h-full bg-slate-50">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interventions - JPP Plomberie</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="h-full flex flex-col md:flex-row">

  <aside class="w-full md:w-64 bg-slate-900 text-slate-300 flex flex-col justify-between p-4">
    <div class="space-y-6">
      <div class="flex items-center gap-3 p-2">
        <div class="w-10 h-10 rounded-xl bg-red-600 flex items-center justify-center text-white text-2xl font-black">J</div>
        <div>
          <h1 class="font-bold text-white leading-tight">JPP Plomberie</h1>
          <p class="text-xs text-emerald-400">● En ligne</p>
        </div>
      </div>
      <nav class="space-y-1">
        <a href="dashboard.html" class="flex items-center gap-3 px-4 py-3 hover:bg-slate-800 rounded-xl text-sm font-medium"><i class="fa-solid fa-chart-pie w-5"></i> Dashboard</a>
        <a href="clients.html" class="flex items-center gap-3 px-4 py-3 hover:bg-slate-800 rounded-xl text-sm font-medium"><i class="fa-solid fa-users w-5"></i> Clients</a>
        <a href="interventions.html" class="flex items-center gap-3 px-4 py-3 bg-blue-600 text-white rounded-xl text-sm font-medium"><i class="fa-solid fa-clipboard-list w-5"></i> Interventions</a>
        <a href="devis.html" class="flex items-center gap-3 px-4 py-3 hover:bg-slate-800 rounded-xl text-sm font-medium"><i class="fa-solid fa-file-invoice-dollar w-5"></i> Devis</a>
        <a href="stock.html" class="flex items-center gap-3 px-4 py-3 hover:bg-slate-800 rounded-xl text-sm font-medium"><i class="fa-solid fa-boxes-stacked w-5"></i> Stock</a>
      </nav>
    </div>
    <button onclick="logout()" class="w-full flex items-center justify-center gap-2 px-4 py-2.5 text-xs font-semibold rounded-xl text-slate-400 hover:bg-slate-800 hover:text-rose-400 transition">
      <i class="fa-solid fa-right-from-bracket"></i> Déconnexion
    </button>
  </aside>

  <main class="flex-1 p-8 overflow-y-auto space-y-6">
    <h2 class="text-2xl font-bold text-slate-900">Interventions</h2>

    <div class="bg-white p-6 rounded-2xl border border-slate-100 shadow-sm">
      <form onsubmit="saveIntervention(event)" class="grid grid-cols-1 md:grid-cols-3 gap-4">
        <select id="inter-client" class="px-4 py-2.5 rounded-xl border text-sm" required></select>
        <select id="inter-statut" class="px-4 py-2.5 rounded-xl border text-sm">
          <option value="A faire">A faire</option>
          <option value="En cours">En cours</option>
          <option value="Terminé">Terminé</option>
        </select>
        <input type="text" id="inter-desc" placeholder="Description des travaux" class="md:col-span-3 px-4 py-2.5 rounded-xl border text-sm" required>
        <button type="submit" class="md:col-span-3 bg-blue-600 text-white py-2.5 rounded-xl text-sm font-semibold hover:bg-blue-700">Créer Intervention</button>
      </form>
    </div>

    <div class="bg-white rounded-2xl border border-slate-100 shadow-sm overflow-hidden">
      <table class="w-full text-left text-sm">
        <thead class="bg-slate-50 border-b text-xs uppercase text-slate-400">
          <tr><th class="p-4">Client</th><th class="p-4">Description</th><th class="p-4">Statut</th><th class="p-4 text-right">Actions</th></tr>
        </thead>
        <tbody id="table-interventions" class="divide-y"></tbody>
      </table>
    </div>
  </main>

  <script src="js/app.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/interventions.js"></script>
</body>
</html>

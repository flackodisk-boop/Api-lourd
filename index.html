<!DOCTYPE html>
<html lang="fr" class="h-full bg-slate-950">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Nexus WhatsApp App</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { font-family: 'Plus Jakarta Sans', sans-serif; }
    .chat-scroll::-webkit-scrollbar { width: 4px; }
    .chat-scroll::-webkit-scrollbar-thumb { background: #6366f1; border-radius: 10px; }
    .wa-bg {
      background-color: #030712;
      background-image: radial-gradient(#1e1b4b 1px, transparent 1px);
      background-size: 20px 20px;
    }
  </style>
</head>
<body class="h-full text-slate-100 flex justify-center items-center bg-slate-950 antialiased select-none">

  <div class="w-full max-w-md h-full md:h-[92vh] md:rounded-3xl bg-slate-900 border border-slate-800 shadow-2xl flex flex-col overflow-hidden relative">

    <header class="bg-slate-900 border-b border-slate-800 p-3.5 flex items-center justify-between sticky top-0 z-30">
      <div class="flex items-center gap-2">
        <h1 class="font-extrabold text-lg bg-gradient-to-r from-indigo-400 via-purple-400 to-cyan-400 bg-clip-text text-transparent tracking-wide">Nexus</h1>
        <span class="text-[9px] bg-indigo-950 text-indigo-300 border border-indigo-700/50 px-1.5 py-0.5 rounded-full font-bold">V1.0</span>
      </div>
      <div class="flex items-center gap-4 text-slate-400">
        <i class="fa-solid fa-camera hover:text-indigo-400 cursor-pointer transition"></i>
        <i class="fa-solid fa-magnifying-glass hover:text-indigo-400 cursor-pointer transition"></i>
        <i class="fa-solid fa-ellipsis-vertical hover:text-indigo-400 cursor-pointer transition" onclick="showMenu()"></i>
      </div>
    </header>

    <div id="view-chats-list" class="flex-1 overflow-y-auto chat-scroll">
      <div onclick="openChat('NEO')" class="flex items-center gap-3 p-3 hover:bg-slate-800/60 cursor-pointer border-b border-slate-800/40 transition">
        <div class="relative">
          <img src="https://api.dicebear.com/7.x/bottts/svg?seed=nexus" class="w-12 h-12 rounded-full bg-slate-950 border border-indigo-500/50 object-cover">
          <span class="absolute bottom-0 right-0 w-3 h-3 bg-emerald-500 border-2 border-slate-900 rounded-full"></span>
        </div>
        <div class="flex-1 min-w-0">
          <div class="flex justify-between items-center mb-0.5">
            <h2 class="font-bold text-xs text-white truncate flex items-center gap-1">
              NEO AI <i class="fa-solid fa-circle-check text-indigo-400 text-[10px]"></i>
            </h2>
            <span class="text-[9px] text-indigo-400 font-mono" id="last-msg-time">En ligne</span>
          </div>
          <p class="text-[11px] text-slate-400 truncate" id="last-msg-preview">Créé par Célestin 🇨🇩</p>
        </div>
      </div>

      <div onclick="openChat('Célestin')" class="flex items-center gap-3 p-3 hover:bg-slate-800/60 cursor-pointer border-b border-slate-800/40 transition">
        <div class="w-12 h-12 rounded-full bg-indigo-900/50 border border-purple-500/30 flex items-center justify-center font-bold text-indigo-300 text-sm">
          🇨🇩
        </div>
        <div class="flex-1 min-w-0">
          <div class="flex justify-between items-center mb-0.5">
            <h2 class="font-bold text-xs text-white">Célestin (Créateur)</h2>
            <span class="text-[9px] text-slate-500">10:15</span>
          </div>
          <p class="text-[11px] text-slate-400 truncate">Projet Nexus prêt !</p>
        </div>
      </div>
    </div>

    <div id="view-chat-room" class="hidden flex-1 flex-col h-full wa-bg overflow-hidden relative">
      <div class="bg-slate-900/95 border-b border-slate-800 p-2.5 flex items-center justify-between z-10">
        <div class="flex items-center gap-2">
          <i class="fa-solid fa-arrow-left text-slate-400 p-2 cursor-pointer hover:text-white" onclick="closeChat()"></i>
          <img id="room-avatar" src="https://api.dicebear.com/7.x/bottts/svg?seed=nexus" class="w-8 h-8 rounded-full bg-slate-950">
          <div>
            <h3 id="room-title" class="font-bold text-xs text-white">NEO AI</h3>
            <p id="room-status" class="text-[9px] text-emerald-400">Auto-Bot actif</p>
          </div>
        </div>
        <div class="flex items-center gap-3 text-slate-400 text-xs">
          <i class="fa-solid fa-video cursor-pointer hover:text-indigo-400"></i>
          <i class="fa-solid fa-phone cursor-pointer hover:text-indigo-400"></i>
        </div>
      </div>

      <div id="messages-box" class="flex-1 p-3 overflow-y-auto space-y-2 chat-scroll"></div>

      <form onsubmit="sendMsg(event)" class="p-2 bg-slate-900 border-t border-slate-800 flex items-center gap-2">
        <input type="text" id="chat-input" placeholder="Message..." class="flex-1 bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-indigo-500">
        <button type="submit" class="w-9 h-9 rounded-xl bg-gradient-to-tr from-indigo-600 to-cyan-500 text-white flex items-center justify-center text-xs shadow-lg">
          <i class="fa-solid fa-paper-plane"></i>
        </button>
      </form>
    </div>

    <div id="view-status" class="hidden flex-1 overflow-y-auto p-4 space-y-3">
      <h2 class="text-xs font-bold text-indigo-400 uppercase tracking-wider">Mon Statut</h2>
      <div class="flex items-center gap-3 p-2 bg-slate-800/40 rounded-xl border border-slate-800">
        <div class="w-10 h-10 rounded-full border-2 border-dashed border-indigo-500 flex items-center justify-center text-indigo-400">
          <i class="fa-solid fa-plus"></i>
        </div>
        <div>
          <h3 class="font-bold text-xs text-white">Ajouter un statut</h3>
          <p class="text-[10px] text-slate-400">Appuyez pour ajouter une mise à jour</p>
        </div>
      </div>
    </div>

    <div id="view-calls" class="hidden flex-1 overflow-y-auto p-4 space-y-3">
      <h2 class="text-xs font-bold text-indigo-400 uppercase tracking-wider">Historique des appels</h2>
      <div class="flex items-center justify-between p-3 bg-slate-800/40 rounded-xl border border-slate-800">
        <div class="flex items-center gap-3">
          <i class="fa-solid fa-arrow-down-left text-emerald-400 text-xs"></i>
          <div>
            <h3 class="font-bold text-xs text-white">Célestin 🇨🇩</h3>
            <p class="text-[10px] text-slate-400">Aujourd'hui, 10:14</p>
          </div>
        </div>
        <i class="fa-solid fa-phone text-indigo-400 text-xs cursor-pointer"></i>
      </div>
    </div>

    <nav class="bg-slate-900 border-t border-slate-800 py-2 px-6 flex justify-around items-center sticky bottom-0 z-30">
      <button onclick="switchTab('chats')" id="tab-chats" class="flex flex-col items-center gap-1 text-indigo-400">
        <i class="fa-solid fa-comment-dots text-base"></i>
        <span class="text-[9px] font-bold">Discussions</span>
      </button>

      <button onclick="switchTab('status')" id="tab-status" class="flex flex-col items-center gap-1 text-slate-500 hover:text-indigo-400">
        <i class="fa-solid fa-circle-notch text-base"></i>
        <span class="text-[9px] font-bold">Statut</span>
      </button>

      <button onclick="switchTab('calls')" id="tab-calls" class="flex flex-col items-center gap-1 text-slate-500 hover:text-indigo-400">
        <i class="fa-solid fa-phone text-base"></i>
        <span class="text-[9px] font-bold">Appels</span>
      </button>
    </nav>

  </div>

  <script>
    let currentChat = null;

    function switchTab(tab) {
      document.getElementById('view-chats-list').classList.add('hidden');
      document.getElementById('view-chat-room').classList.add('hidden');
      document.getElementById('view-status').classList.add('hidden');
      document.getElementById('view-calls').classList.add('hidden');

      ['chats', 'status', 'calls'].forEach(t => {
        document.getElementById(`tab-${t}`).className = "flex flex-col items-center gap-1 text-slate-500";
      });

      if (tab === 'chats') {
        document.getElementById('view-chats-list').classList.remove('hidden');
        document.getElementById('tab-chats').className = "flex flex-col items-center gap-1 text-indigo-400";
      } else if (tab === 'status') {
        document.getElementById('view-status').classList.remove('hidden');
        document.getElementById('tab-status').className = "flex flex-col items-center gap-1 text-indigo-400";
      } else if (tab === 'calls') {
        document.getElementById('view-calls').classList.remove('hidden');
        document.getElementById('tab-calls').className = "flex flex-col items-center gap-1 text-indigo-400";
      }
    }

    function openChat(name) {
      currentChat = name;
      document.getElementById('view-chats-list').classList.add('hidden');
      document.getElementById('view-chat-room').classList.remove('hidden');
      document.getElementById('view-chat-room').classList.add('flex');

      document.getElementById('room-title').innerText = name;
      renderRoomMessages();
    }

    function closeChat() {
      document.getElementById('view-chat-room').classList.add('hidden');
      document.getElementById('view-chat-room').classList.remove('flex');
      document.getElementById('view-chats-list').classList.remove('hidden');
    }

    function renderRoomMessages() {
      const box = document.getElementById('messages-box');
      if (currentChat === 'NEO') {
        box.innerHTML = `
          <div class="flex flex-col gap-1 max-w-[80%] bg-slate-800 p-2.5 rounded-xl border border-slate-700 text-xs text-slate-200">
            <p>Bonjour ! 👋 Je suis <b>NEO</b>, l'Auto-Bot créé par <b>Célestin 🇨🇩</b>. Pose-moi une question !</p>
            <span class="text-[8px] text-right text-slate-400">10:00</span>
          </div>
        `;
      } else {
        box.innerHTML = `
          <div class="flex flex-col gap-1 max-w-[80%] bg-slate-800 p-2.5 rounded-xl border border-slate-700 text-xs text-slate-200">
            <p>Salut ! L'application Nexus fonctionne à 100%.</p>
            <span class="text-[8px] text-right text-slate-400">10:15</span>
          </div>
        `;
      }
    }

    function sendMsg(e) {
      e.preventDefault();
      const input = document.getElementById('chat-input');
      const text = input.value.trim();
      if (!text) return;

      const box = document.getElementById('messages-box');
      box.innerHTML += `
        <div class="flex flex-col gap-1 max-w-[80%] ml-auto bg-indigo-600 p-2.5 rounded-xl text-xs text-white">
          <p>${text}</p>
          <span class="text-[8px] text-right text-indigo-200">Aujourd'hui</span>
        </div>
      `;

      input.value = '';
      box.scrollTop = box.scrollHeight;

      if (currentChat === 'NEO') {
        setTimeout(() => {
          let reply = "Je suis NEO, l'Auto-Bot autonome.";
          if (text.toLowerCase().includes("créateur") || text.toLowerCase().includes("qui t'a créé")) {
            reply = "J’ai été créé par Célestin 🇨🇩";
          }
          box.innerHTML += `
            <div class="flex flex-col gap-1 max-w-[80%] bg-slate-800 p-2.5 rounded-xl border border-slate-700 text-xs text-slate-200">
              <p>${reply}</p>
              <span class="text-[8px] text-right text-slate-400">Aujourd'hui</span>
            </div>
          `;
          box.scrollTop = box.scrollHeight;
        }, 600);
      }
    }

    function showMenu() {
      alert("Nexus App Auto-Bot\nCréateur : Célestin 🇨🇩");
    }
  </script>
</body>
</html>

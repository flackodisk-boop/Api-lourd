<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JPP Plomberie — App AI Chat</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Poppins", sans-serif;
        }

        body {
            min-height: 100vh;
            background: 
                radial-gradient(circle at top, rgba(225, 29, 72, 0.25), transparent 40%),
                radial-gradient(circle at bottom, rgba(59, 130, 246, 0.25), transparent 40%), 
                #020617;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
        }

        .chat-container {
            width: 95%;
            max-width: 450px;
            height: 90vh;
            background: rgba(15, 23, 42, 0.85);
            border: 1px solid rgba(225, 29, 72, 0.3);
            border-radius: 25px;
            box-shadow: 
                0 0 25px rgba(225, 29, 72, 0.3), 
                inset 0 0 20px rgba(59, 130, 246, 0.2);
            backdrop-filter: blur(15px);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .chat-header {
            padding: 18px 20px;
            display: flex;
            align-items: center;
            gap: 15px;
            background: linear-gradient(135deg, #e11d48, #2563eb);
            box-shadow: 0 0 20px rgba(225, 29, 72, 0.4);
        }

        .bot-logo {
            width: 45px;
            height: 45px;
            border-radius: 14px;
            background: #020617;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            font-weight: 900;
            color: #38bdf8;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.4);
        }

        .header-text h2 {
            font-size: 17px;
            font-weight: 700;
        }

        .header-text span {
            font-size: 12px;
            color: #e0f2fe;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background-color: #10b981;
            border-radius: 50%;
            box-shadow: 0 0 8px #10b981;
            transition: background-color 0.3s ease;
        }

        .messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .message {
            max-width: 82%;
            padding: 12px 16px;
            border-radius: 18px;
            animation: show 0.3s ease;
            font-size: 13.5px;
            line-height: 1.4;
        }

        @keyframes show {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .user-message {
            align-self: flex-end;
            background: linear-gradient(135deg, #2563eb, #06b6d4);
            box-shadow: 0 0 15px rgba(6, 182, 212, 0.4);
            border-bottom-right-radius: 4px;
        }

        .admin-message {
            align-self: flex-start;
            background: #0f172a;
            border: 1px solid rgba(225, 29, 72, 0.4);
            box-shadow: 0 0 12px rgba(225, 29, 72, 0.2);
            border-bottom-left-radius: 4px;
        }

        .time {
            display: block;
            margin-top: 5px;
            font-size: 9.5px;
            opacity: 0.7;
            text-align: right;
        }

        .chat-input {
            padding: 15px;
            display: flex;
            gap: 10px;
            background: #020617;
            border-top: 1px solid rgba(225, 29, 72, 0.3);
        }

        #messageInput {
            flex: 1;
            padding: 14px 18px;
            border-radius: 30px;
            outline: none;
            border: 1px solid rgba(59, 130, 246, 0.5);
            background: #0f172a;
            color: white;
            box-shadow: 0 0 10px rgba(59, 130, 246, 0.2);
        }

        #messageInput:focus {
            border-color: #38bdf8;
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.4);
        }

        #sendBtn {
            width: 50px;
            height: 50px;
            border: none;
            border-radius: 50%;
            cursor: pointer;
            color: white;
            font-size: 18px;
            background: linear-gradient(135deg, #e11d48, #2563eb);
            box-shadow: 0 0 15px rgba(225, 29, 72, 0.5);
            transition: transform 0.2s ease;
        }

        #sendBtn:hover {
            transform: scale(1.08);
        }

        .messages::-webkit-scrollbar {
            width: 5px;
        }

        .messages::-webkit-scrollbar-thumb {
            background: #e11d48;
            border-radius: 10px;
        }
    </style>
</head>
<body>

<div class="chat-container">
    <header class="chat-header">
        <div class="bot-logo">JPP</div>
        <div class="header-text">
            <h2>JPP Assistant IA</h2>
            <span id="status">
                <span class="status-dot"></span> Support en ligne
            </span>
        </div>
    </header>

    <div class="messages" id="messages"></div>

    <div class="chat-input">
        <input id="messageInput" type="text" placeholder="Posez votre question à l'IA..." autocomplete="off">
        <button id="sendBtn">➤</button>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', () => {
    // 1. GESTION DE L'UTILISATEUR CONNECTÉ
    let currentUser = localStorage.getItem('jpp_user_name');
    if (!currentUser) {
        currentUser = "Client_" + Math.floor(1000 + Math.random() * 9000);
        localStorage.setItem('jpp_user_name', currentUser);
    }

    const messagesContainer = document.getElementById('messages');
    const messageInput = document.getElementById('messageInput');
    const sendBtn = document.getElementById('sendBtn');
    const statusElement = document.getElementById('status');
    const STORAGE_KEY = 'jpp_chat_messages_v2';

    // 2. HORODATAGE DYNAMIQUE
    function getCurrentTime() {
        const now = new Date();
        return `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
    }

    // 3. AFFICHAGE DES MESSAGES DANS LE DOM
    function appendMessage(text, sender, time, username = '') {
        const messageDiv = document.createElement('div');
        messageDiv.classList.add('message');

        const isUser = sender === 'user';
        messageDiv.classList.add(isUser ? 'user-message' : 'admin-message');

        const displayName = isUser ? (username || currentUser) : 'JPP Bot (IA)';

        messageDiv.innerHTML = `
            <div style="font-size: 11px; opacity: 0.8; margin-bottom: 3px; font-weight: 600;">${displayName}</div>
            <div>${text}</div>
            <span class="time">${time}</span>
        `;

        messagesContainer.appendChild(messageDiv);
        scrollToBottom();
    }

    // 4. SAUVEGARDE DE LA DISCUSSION (STORAGE LOCAL)
    function saveMessage(text, sender, time, username) {
        let history = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
        history.push({ text, sender, time, username });
        localStorage.setItem(STORAGE_KEY, JSON.stringify(history));
    }

    // 5. CHARGEMENT DE L'HISTORIQUE
    function loadHistory() {
        const history = JSON.parse(localStorage.getItem(STORAGE_KEY));
        messagesContainer.innerHTML = '';

        if (history && history.length > 0) {
            history.forEach(msg => {
                appendMessage(msg.text, msg.sender, msg.time, msg.username);
            });
        } else {
            const initialText = `Bonjour ${currentUser} ! 🛠️ Je suis l'assistant IA de JPP Plomberie. Comment puis-je vous aider ?`;
            const initTime = getCurrentTime();
            appendMessage(initialText, 'admin', initTime);
            saveMessage(initialText, 'admin', initTime, 'JPP Bot (IA)');
        }
    }

    function scrollToBottom() {
        messagesContainer.scrollTop = messagesContainer.scrollHeight;
    }

    // 6. GESTION DU STATUT ("En train d'écrire...")
    function setTypingStatus(isTyping) {
        if (!statusElement) return;
        if (isTyping) {
            statusElement.innerHTML = `<span class="status-dot" style="background:#38bdf8; box-shadow:0 0 8px #38bdf8;"></span> Support écrit...`;
        } else {
            statusElement.innerHTML = `<span class="status-dot"></span> Support en ligne`;
        }
    }

    // 7. MOTEUR DE RÉPONSE IA CONNECTÉ
    function generateAIResponse(userQuery) {
        setTypingStatus(true);
        const query = userQuery.toLowerCase();
        const delay = Math.floor(Math.random() * 800) + 1000;

        setTimeout(() => {
            let reply = "";

            if (query.includes('fuite') || query.includes('eau') || query.includes('inondation') || query.includes('urgence')) {
                reply = "🚨 **Urgence détectée !** Coupez immédiatement la vanne d'arrivée d'eau principale. Voulez-vous que je localise un artisan JPP à proximité ?";
            } else if (query.includes('devis') || query.includes('prix') || query.includes('tarif') || query.includes('combien')) {
                reply = "📋 Nos tarifs dépendent de l'intervention. Pour un devis précis, décrivez la panne (ex: débouchage, remplacement de robinet, installation).";
            } else if (query.includes('rdv') || query.includes('rendez-vous') || query.includes('quand') || query.includes('dispo')) {
                reply = "📅 Nos équipes sont disponibles 7j/7. Indiquez-moi le jour et l'heure qui vous arrangent pour la prise de RDV.";
            } else if (query.includes('bonjour') || query.includes('salut') || query.includes('coucou') || query.includes('hello')) {
                reply = `Ravi de vous revoir ! En quoi l'équipe JPP peut vous être utile aujourd'hui ?`;
            } else if (query.includes('merci') || query.includes('top') || query.includes('parfait')) {
                reply = "À votre service ! N'hésitez pas si vous avez la moindre urgence plomberie. 🔧";
            } else {
                reply = "Entendu. J'ai bien transmis votre message à l'équipe technique JPP. Avez-vous une photo ou un détail supplémentaire à ajouter ?";
            }

            const time = getCurrentTime();
            setTypingStatus(false);
            appendMessage(reply, 'admin', time);
            saveMessage(reply, 'admin', time, 'JPP Bot (IA)');
        }, delay);
    }

    // 8. ENVOI DU MESSAGE
    function sendMessage() {
        const text = messageInput.value.trim();
        if (!text) return;

        const time = getCurrentTime();
        
        appendMessage(text, 'user', time, currentUser);
        saveMessage(text, 'user', time, currentUser);

        messageInput.value = '';
        generateAIResponse(text);
    }

    // Événements
    sendBtn.addEventListener('click', sendMessage);
    messageInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') sendMessage();
    });

    // Lancement
    loadHistory();
});
</script>

</body>
  </html>

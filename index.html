<!DOCTYPE html>
<html lang="fr" class="h-full bg-slate-950">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>JPP Plomberie — App & Settings</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @keyframes logo-glow {
      0%, 100% {
        box-shadow: 0 0 25px rgba(225, 29, 72, 0.6), 0 0 50px rgba(59, 130, 246, 0.4);
        transform: scale(1);
      }
      50% {
        box-shadow: 0 0 40px rgba(225, 29, 72, 0.9), 0 0 70px rgba(59, 130, 246, 0.7);
        transform: scale(1.05);
      }
    }
    .cool-logo-glow { animation: logo-glow 2.5s infinite ease-in-out; }
    .chat-scroll { scrollbar-width: thin; scrollbar-color: #334155 transparent; }
  </style>
</head>
<body id="app-body" class="h-full text-slate-100 flex flex-col justify-between overflow-x-hidden font-sans select-none bg-slate-950 transition-colors duration-300">

  <div id="splash-screen" class="fixed inset-0 bg-slate-950 flex flex-col items-center justify-between p-8 z-50 transition-all duration-700">
    <div></div>
    
    <div class="flex flex-col items-center space-y-6">
      <div class="relative group">
        <div class="absolute -inset-1 bg-gradient-to-r from-red-600 via-purple-600 to-blue-600 rounded-3xl blur-md opacity-75 animate-pulse"></div>
        <div class="relative w-24 h-24 rounded-3xl bg-slate-900 border border-slate-700 flex items-center justify-center text-white text-6xl font-black cool-logo-glow">
          <span class="bg-gradient-to-tr from-red-500 via-rose-400 to-blue-500 bg-clip-text text-transparent">J</span>
          <span class="absolute top-1 right-2 w-3 h-3 bg-blue-500 rounded-full animate-ping"></span>
        </div>
      </div>

      <div class="text-center space-y-1">
        <h1 class="text-2xl font-black tracking-wider text-white">JPP <span class="bg-gradient-to-r from-blue-400 to-cyan-400 bg-clip-text text-transparent">PLOMBERIE</span></h1>
        <p class="text-xs text-slate-400 font-mono tracking-widest uppercase">Application Complète</p>
      </div>
    </div>

    <div class="text-center space-y-1">
      <div class="w-8 h-1 bg-gradient-to-r from-red-500 to-blue-500 mx-auto rounded-full animate-pulse"></div>
      <p class="text-[10px] text-slate-600 font-mono">v5.1.0 — Premium App</p>
    </div>
  </div>

  <div id="app-container" class="hidden flex-1 flex flex-col h-full pb-16">

    <header class="bg-slate-900/90 backdrop-blur-xl border-b border-slate-800 p-3 sticky top-0 z-30 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-2xl bg-gradient-to-br from-red-600 to-blue-600 p-[2px] shadow-lg shadow-red-600/20">
          <div class="w-full h-full bg-slate-950 rounded-[14px] flex items-center justify-center text-white font-black text-xl">
            J
          </div>
        </div>
        <div>
          <h1 class="font-bold text-xs text-white flex items-center gap-1.5">
            <span id="header-user-name">Mon Profil</span>
            <i class="fa-solid fa-circle-check text-blue-500 text-[10px]"></i>
          </h1>
          <p class="text-[10px] text-emerald-400 flex items-center gap-1">
            <span class="w-2 h-2 bg-emerald-500 rounded-full animate-pulse"></span> Service actif
          </p>
        </div>
      </div>
      
      <button onclick="navTo('settings')" class="bg-slate-800 hover:bg-slate-700 text-slate-300 px-3 py-1.5 rounded-xl text-xs font-semibold border border-slate-700 transition flex items-center gap-1.5">
        <i class="fa-solid fa-gear text-blue-400"></i> Réglages
      </button>
    </header>

    <main class="flex-1 p-3 max-w-lg mx-auto w-full flex flex-col justify-between overflow-hidden">
      
      <section id="page-chat" class="flex-1 flex flex-col justify-between overflow-hidden h-full">
        <div id="messages-container" class="flex-1 overflow-y-auto space-y-3 pr-1 chat-scroll flex flex-col">
        </div>

        <div id="image-preview-bar" class="hidden p-2 bg-slate-900 rounded-t-xl border-t border-slate-800 flex items-center justify-between mt-2">
          <div class="flex items-center gap-2">
            <img id="preview-thumb" src="" class="w-8 h-8 rounded object-cover border border-slate-700">
            <span class="text-xs text-blue-400 font-semibold"><i class="fa-solid fa-image mr-1"></i> Image prête</span>
          </div>
          <button onclick="clearImage()" class="text-rose-500 text-xs font-bold px-2">Annuler</button>
        </div>

        <div class="grid grid-cols-4 gap-1.5 my-2">
          <button onclick="sendQuickAction('🚨 URGENCE : Fuite d\'eau détectée !')" class="bg-rose-950/40 border border-rose-800/50 hover:bg-rose-900/50 text-rose-300 p-2 rounded-xl text-[10px] font-bold flex flex-col items-center gap-1 transition active:scale-95">
            <i class="fa-solid fa-bolt text-rose-500 text-sm"></i>
            <span>Urgence</span>
          </button>

          <button onclick="sendQuickAction('📋 DEVIS : Demande d\'estimation rapide.')" class="bg-blue-950/40 border border-blue-800/50 hover:bg-blue-900/50 text-blue-300 p-2 rounded-xl text-[10px] font-bold flex flex-col items-center gap-1 transition active:scale-95">
            <i class="fa-solid fa-file-invoice text-blue-500 text-sm"></i>
            <span>Devis</span>
          </button>

          <button onclick="sendQuickAction('🔧 RDV : Demande de rendez-vous.')" class="bg-amber-950/40 border border-amber-800/50 hover:bg-amber-900/50 text-amber-300 p-2 rounded-xl text-[10px] font-bold flex flex-col items-center gap-1 transition active:scale-95">
            <i class="fa-solid fa-calendar-day text-amber-500 text-sm"></i>
            <span>RDV</span>
          </button>

          <button onclick="shareLocation()" class="bg-emerald-950/40 border border-emerald-800/50 hover:bg-emerald-950/50 text-emerald-300 p-2 rounded-xl text-[10px] font-bold flex flex-col items-center gap-1 transition active:scale-95">
            <i class="fa-solid fa-location-dot text-emerald-500 text-sm"></i>
            <span>Position</span>
          </button>
        </div>

        <form onsubmit="sendMessage(event)" class="bg-slate-900/90 p-2 rounded-2xl border border-slate-800 flex items-center gap-2 shadow-xl">
          <label for="file-input" class="cursor-pointer text-slate-400 hover:text-blue-500 p-2 transition">
            <i class="fa-solid fa-paperclip text-lg"></i>
          </label>
          <input type="file" id="file-input" accept="image/*" class="hidden" onchange="handleFileSelect(event)">

          <input type="text" id="chat-text" placeholder="Envoyer un message..." class="flex-1 bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-blue-500">

          <button type="submit" class="bg-gradient-to-r from-blue-600 to-cyan-600 hover:from-blue-500 hover:to-cyan-500 text-white w-9 h-9 rounded-xl text-xs font-bold transition flex items-center justify-center shadow-lg shadow-blue-600/30 active:scale-90">
            <i class="fa-solid fa-paper-plane"></i>
          </button>
        </form>
      </section>

      <section id="page-settings" class="hidden flex-1 overflow-y-auto space-y-4 py-2">
        <h2 class="text-lg font-bold text-white flex items-center gap-2">
          <i class="fa-solid fa-sliders text-blue-500"></i> Paramètres de l'application
        </h2>

        <div class="bg-slate-900 p-4 rounded-2xl border border-slate-800 space-y-3">
          <h3 class="text-xs font-bold text-slate-400 uppercase tracking-wider">Mon Profil</h3>
          <div class="flex items-center gap-3">
            <img id="settings-avatar" src="" class="w-12 h-12 rounded-full border-2 border-blue-500 bg-slate-950 object-cover">
            <div class="flex-1">
              <input type="text" id="input-username" class="bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-white w-full focus:outline-none focus:border-blue-500" placeholder="Votre nom/pseudo">
            </div>
            <button onclick="saveProfile()" class="bg-blue-600 hover:bg-blue-700 text-white px-3 py-2 rounded-xl text-xs font-bold transition">Enregistrer</button>
          </div>
        </div>

        <div class="bg-slate-900 p-4 rounded-2xl border border-slate-800 space-y-3">
          <h3 class="text-xs font-bold text-slate-400 uppercase tracking-wider">Préférences</h3>
          <div class="flex justify-between items-center py-1">
            <span class="text-xs text-slate-300">Notifications sonores</span>
            <input type="checkbox" id="toggle-sound" class="w-4 h-4 text-blue-600 rounded bg-slate-950 border-slate-800 cursor-pointer" checked onchange="toggleSoundPref()">
          </div>
          <div class="flex justify-between items-center py-1 border-t border-slate-800/60">
            <span class="text-xs text-slate-300">Mode Ultra Sombre</span>
            <input type="checkbox" id="toggle-dark" class="w-4 h-4 text-blue-600 rounded bg-slate-950 border-slate-800 cursor-pointer" checked onchange="toggleTheme(this)">
          </div>
        </div>

        <div class="bg-slate-900 p-4 rounded-2xl border border-slate-800 space-y-3">
          <h3 class="text-xs font-bold text-slate-400 uppercase tracking-wider">Stockage & Données</h3>
          <button onclick="clearChatHistory()" class="w-full bg-amber-500/10 hover:bg-amber-500/20 text-amber-400 border border-amber-500/30 p-2.5 rounded-xl text-xs font-semibold text-left flex items-center justify-between transition">
            <span>Vider l'historique de discussion</span>
            <i class="fa-solid fa-broom"></i>
          </button>
          <button onclick="resetApp()" class="w-full bg-rose-500/10 hover:bg-rose-500/20 text-rose-400 border border-rose-500/30 p-2.5 rounded-xl text-xs font-semibold text-left flex items-center justify-between transition">
            <span>Réinitialiser toute l'application</span>
            <i class="fa-solid fa-trash-can"></i>
          </button>
        </div>
      </section>

    </main>

    <nav class="fixed bottom-0 left-0 right-0 bg-slate-900/95 backdrop-blur-lg border-t border-slate-800 py-2 px-6 flex justify-around items-center z-40">
      <button onclick="navTo('chat')" id="tab-chat" class="flex flex-col items-center space-y-1 text-blue-500">
        <i class="fa-solid fa-comments text-lg"></i>
        <span class="text-[10px] font-medium">Messenger</span>
      </button>

      <button onclick="navTo('settings')" id="tab-settings" class="flex flex-col items-center space-y-1 text-slate-500">
        <i class="fa-solid fa-gear text-lg"></i>
        <span class="text-[10px] font-medium">Paramètres</span>
      </button>
    </nav>

  </div>

  <script>
    let currentUser = localStorage.getItem('app_user') || "Client_" + Math.floor(Math.random() * 899 + 100);
    let currentAvatar = localStorage.getItem('app_avatar') || `https://api.dicebear.com/7.x/bottts/svg?seed=${currentUser}`;
    let attachedImageBase64 = null;
    let soundEnabled = localStorage.getItem('app_sound') !== 'false';

    // Initialisation
    function initApp() {
      document.getElementById('header-user-name').innerText = currentUser;
      document.getElementById('settings-avatar').src = currentAvatar;
      document.getElementById('input-username').value = currentUser;
      document.getElementById('toggle-sound').checked = soundEnabled;
      
      initChatStorage();
      renderMessages();
    }

    document.addEventListener('DOMContentLoaded', () => {
      initApp();

      setTimeout(() => {
        document.getElementById('splash-screen').classList.add('opacity-0', 'pointer-events-none');
        document.getElementById('app-container').classList.remove('hidden');
        setTimeout(() => document.getElementById('splash-screen').remove(), 700);
      }, 1800);
    });

    // Navigation
    function navTo(pageId) {
      document.getElementById('page-chat').classList.add('hidden');
      document.getElementById('page-settings').classList.add('hidden');
      
      document.getElementById('tab-chat').className = "flex flex-col items-center space-y-1 text-slate-500";
      document.getElementById('tab-settings').className = "flex flex-col items-center space-y-1 text-slate-500";

      document.getElementById(`page-${pageId}`).classList.remove('hidden');
      document.getElementById(`tab-${pageId}`).className = "flex flex-col items-center space-y-1 text-blue-500";
      
      if(pageId === 'chat') {
        scrollToBottom();
      }
    }

    // Gestion Stockage Local
    function initChatStorage() {
      if (!localStorage.getItem('jpp_app_db')) {
        const initialMessages = [
          {
            id: 1,
            user: "Support JPP",
            avatar: "https://api.dicebear.com/7.x/bottts/svg?seed=JPP_Support",
            text: "Bonjour et bienvenue chez JPP Plomberie ! 🛠️ Comment pouvons-nous vous aider aujourd'hui ?",
            image: null,
            time: "10:00"
          }
        ];
        localStorage.setItem('jpp_app_db', JSON.stringify(initialMessages));
      }
    }

    function getMessages() {
      initChatStorage();
      return JSON.parse(localStorage.getItem('jpp_app_db'));
    }

    // Profil et Réglages
    function saveProfile() {
      const newName = document.getElementById('input-username').value.trim();
      if (newName) {
        currentUser = newName;
        currentAvatar = `https://api.dicebear.com/7.x/bottts/svg?seed=${encodeURIComponent(currentUser)}`;
        localStorage.setItem('app_user', currentUser);
        localStorage.setItem('app_avatar', currentAvatar);
        
        document.getElementById('header-user-name').innerText = currentUser;
        document.getElementById('settings-avatar').src = currentAvatar;
        alert("Profil mis à jour !");
        renderMessages();
      }
    }

    function toggleSoundPref() {
      soundEnabled = document.getElementById('toggle-sound').checked;
      localStorage.setItem('app_sound', soundEnabled);
    }

    function toggleTheme(checkbox) {
      const body = document.getElementById('app-body');
      if (checkbox.checked) {
        body.classList.replace('bg-slate-900', 'bg-slate-950');
      } else {
        body.classList.replace('bg-slate-950', 'bg-slate-900');
      }
    }

    // Effet Sonore de Notification
    function playNotificationSound() {
      if (!soundEnabled) return;
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(587.33, ctx.currentTime); // Note D5
        gain.gain.setValueAtTime(0.1, ctx.currentTime);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 0.15);
      } catch(e) {
        console.log("Audio non supporté sans interaction préalable.");
      }
    }

    // Traitement des Images
    function handleFileSelect(e) {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(event) {
          attachedImageBase64 = event.target.result;
          document.getElementById('preview-thumb').src = attachedImageBase64;
          document.getElementById('image-preview-bar').classList.remove('hidden');
        };
        reader.readAsDataURL(file);
      }
    }

    function clearImage() {
      attachedImageBase64 = null;
      document.getElementById('file-input').value = '';
      document.getElementById('image-preview-bar').classList.add('hidden');
    }

    // Logique d'envoi et de simulation de réponse
    function pushMessage(text, image = null, user = currentUser, avatar = currentAvatar) {
      const messages = getMessages();
      const now = new Date();
      const timeStr = `${now.getHours().toString().padStart(2, '0')}:${now.getMinutes().toString().padStart(2, '0')}`;

      messages.push({
        id: Date.now(),
        user: user,
        avatar: avatar,
        text: text,
        image: image,
        time: timeStr
      });

      localStorage.setItem('jpp_app_db', JSON.stringify(messages));
      renderMessages();
      playNotificationSound();

      // Déclencher une réponse automatique si c'est l'utilisateur qui écrit
      if (user === currentUser) {
        triggerBotResponse(text);
      }
    }

    function triggerBotResponse(userMsg) {
      setTimeout(() => {
        let botText = "Merci pour votre message. Un technicien va vous répondre sous peu.";
        
        if (userMsg.includes("🚨 URGENCE")) {
          botText = "🚨 ALERTE REÇUE ! Une équipe d'urgence est notifiée. Restez joignable.";
        } else if (userMsg.includes("📋 DEVIS")) {
          botText = "📋 Un conseiller va analyser votre demande d'estimation dans les plus brefs délais.";
        } else if (userMsg.includes("📍 Localisation")) {
          botText = "📍 Position bien reçue ! Nous la transmettons au plombier en route.";
        }

        pushMessage(
          botText, 
          null, 
          "Support JPP", 
          "https://api.dicebear.com/7.x/bottts/svg?seed=JPP_Support"
        );
      }, 1200);
    }

    function sendMessage(e) {
      e.preventDefault();
      const textInput = document.getElementById('chat-text');
      const text = textInput.value.trim();

      if (!text && !attachedImageBase64) return;

      pushMessage(text, attachedImageBase64);
      textInput.value = '';
      clearImage();
    }

    function sendQuickAction(text) {
      pushMessage(text);
    }

    // Géolocalisation (Corrigée)
    function shareLocation() {
      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(position => {
          const lat = position.coords.latitude;
          const lon = position.coords.longitude;
          const mapUrl = `https://www.google.com/maps?q=${lat},${lon}`;
          pushMessage(`📍 Localisation partagée : ${mapUrl}`);
        }, () => {
          pushMessage("📍 Impossible de récupérer la position GPS précise.");
        });
      } else {
        alert("La géolocalisation n'est pas supportée par votre navigateur.");
      }
    }

    // Rendu des Messages
    function renderMessages() {
      const messages = getMessages();
      const container = document.getElementById('messages-container');

      container.innerHTML = messages.map(m => {
        const isMe = m.user === currentUser;

        return `
          <div class="flex items-end gap-2 ${isMe ? 'flex-row-reverse' : 'flex-row'} mb-1">
            <img src="${m.avatar}" class="w-7 h-7 rounded-full bg-slate-800 border border-slate-700 object-cover flex-shrink-0">
            <div class="max-w-[78%] space-y-1">
              <div class="text-[9px] text-slate-500 font-mono ${isMe ? 'text-right' : 'text-left'} px-1">
                ${m.user} • ${m.time}
              </div>
              <div class="p-3 rounded-2xl text-xs leading-relaxed ${
                isMe 
                  ? 'bg-gradient-to-r from-blue-600 to-cyan-600 text-white rounded-br-none shadow-md shadow-blue-600/20' 
                  : 'bg-slate-900 text-slate-200 border border-slate-800 rounded-bl-none'
              }">
                ${m.text ? `<p class="break-words">${m.text}</p>` : ''}
                ${m.image ? `<img src="${m.image}" class="mt-2 rounded-xl max-h-48 w-full object-cover border border-slate-700">` : ''}
              </div>
            </div>
          </div>
        `;
      }).join('');

      scrollToBottom();
    }

    function scrollToBottom() {
      const container = document.getElementById('messages-container');
      container.scrollTop = container.scrollHeight;
    }

    // Réinitialisations
    function clearChatHistory() {
      if (confirm("Voulez-vous vraiment supprimer l'historique de discussion ?")) {
        localStorage.removeItem('jpp_app_db');
        initChatStorage();
        renderMessages();
      }
    }

    function resetApp() {
      if (confirm("Réinitialiser complètement l'application et supprimer vos données locales ?")) {
        localStorage.clear();
        location.reload();
      }
    }
  </script>
</body>
</html>
